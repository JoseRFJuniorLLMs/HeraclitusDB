[workspace]
resolver = "2"
members = [
    "crates/heraclitus-core",
    "crates/heraclitus-compliance",
    "crates/heraclitus-crypto",
    "crates/heraclitus-log",
    "crates/heraclitus-manifold",
    "crates/heraclitus-memtable",
    "crates/heraclitus-views",
    "crates/heraclitus-index-vector",
    "crates/heraclitus-index-graph",
    "crates/heraclitus-index-text",
    "crates/heraclitus-index-attr",
    "crates/heraclitus-activation",
    "crates/heraclitus-btree",
    "crates/heraclitus-gpu",
    "crates/heraclitus-retrieval",
    "crates/heraclitus-distill",
    "crates/heraclitus-tier",
    "crates/heraclitus-query",
    "crates/heraclitus-raft",
    "crates/heraclitus-proto",
    "crates/heraclitus-server",
    "crates/heraclitus-cli",
    "crates/heraclitus-client",
    "crates/heraclitus-wasm",
    "sim/heraclitus-sim",
    "tools/heraclitus-ingestor", "crates/heraclitus-analytics",
    "crates/hume-kernel",
    "crates/hume-ir",
    "crates/hume-sketches",
]

# O binding PyO3 fica FORA do workspace: precisa de um interpretador Python no
# build (pyo3-build-config), que os runners do CI e `cargo build --workspace`
# não têm de garantir. Constrói-se sozinho via maturin em sdk/python-embedded.
exclude = ["sdk/python-embedded", "fuzz"]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/JoseRFJuniorLLMs/HeraclitusDB"
authors = ["José R. F. Junior", "Claude (Anthropic)"]

[workspace.dependencies]
# internal
heraclitus-core = { path = "crates/heraclitus-core" }
heraclitus-compliance = { path = "crates/heraclitus-compliance" }
heraclitus-crypto = { path = "crates/heraclitus-crypto" }
heraclitus-log = { path = "crates/heraclitus-log" }
heraclitus-manifold = { path = "crates/heraclitus-manifold" }
heraclitus-memtable = { path = "crates/heraclitus-memtable" }
heraclitus-views = { path = "crates/heraclitus-views" }
heraclitus-index-vector = { path = "crates/heraclitus-index-vector" }
heraclitus-index-graph = { path = "crates/heraclitus-index-graph" }
heraclitus-index-text = { path = "crates/heraclitus-index-text" }
heraclitus-index-attr = { path = "crates/heraclitus-index-attr" }
heraclitus-activation = { path = "crates/heraclitus-activation" }
heraclitus-btree = { path = "crates/heraclitus-btree" }
heraclitus-gpu = { path = "crates/heraclitus-gpu" }
heraclitus-retrieval = { path = "crates/heraclitus-retrieval" }
heraclitus-distill = { path = "crates/heraclitus-distill" }
heraclitus-tier = { path = "crates/heraclitus-tier" }
heraclitus-query = { path = "crates/heraclitus-query" }
heraclitus-proto = { path = "crates/heraclitus-proto" }
heraclitus-client = { path = "crates/heraclitus-client" }
heraclitus-analytics = { path = "crates/heraclitus-analytics" }
heraclitus-raft = { path = "crates/heraclitus-raft" }
heraclitus-server = { path = "crates/heraclitus-server" }
# HUME (SPEC-0040.1) — kernel primitivo de execução
hume-kernel = { path = "crates/hume-kernel" }
# HUME-IR (SPEC-000 §6) — representação intermédia SSA
hume-ir = { path = "crates/hume-ir" }

# external
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-stream = "0.1"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
tonic-prost-build = "0.14.6"
protox = "0.9.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
crc32fast = "1"
blake3 = "1"
memmap2 = "0.9.11"
crossbeam-channel = "0.5"
arc-swap = "1"
dashmap = "6"
roaring = "0.10"
chacha20poly1305 = "0.10"
pest = "2"
pest_derive = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
windows-service = "0.7"
metrics = "0.24"
ulid = { version = "1", features = ["serde"] }
toml = "0.8"
rand = "0.8"
proptest = "1"
criterion = "0.5"
clap = { version = "4", features = ["derive"] }
object_store = "0.14.1"
turmoil = "0.6"
arrayvec = { version = "0.7", features = ["serde"] }
tempfile = "3"
# compliance / ICP-Brasil (pure Rust)
der = { version = "0.7", features = ["derive", "oid", "alloc"] }
const-oid = "0.9"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
anyhow = "1.0.103"
csv = "1"
encoding_rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
