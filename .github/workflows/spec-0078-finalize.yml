name: SPEC-0078 final qualification pass

on:
  push:
    branches:
      - gpt56/spec-0078-agent-hardening
    paths:
      - .github/spec-0078-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/spec-0078-agent-hardening
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Apply final SPEC-0078 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Cargo.toml')
          text = p.read_text()
          old = 'ratatui = "0.29"'
          if old not in text:
              raise SystemExit('workspace ratatui 0.29 declaration not found')
          p.write_text(text.replace(old, 'ratatui = "0.30.2"', 1))

          # The oversized, redaction and dedupe paths were already covered.
          # Add the missing malformed-OTLP regression and prove the listener is
          # still alive by ingesting a valid batch afterwards.
          p = Path('crates/heraclitus-agent-gateway/tests/quickstart_otlp.rs')
          text = p.read_text()
          if 'otlp_json_malformado_e_rejeitado_sem_derrubar_o_listener' not in text:
              text = text.rstrip() + r'''

#[tokio::test]
async fn otlp_json_malformado_e_rejeitado_sem_derrubar_o_listener() {
    let q = arrancar().await;
    let (status, _) = post(
        &format!("{}/v1/traces", q.otlp_url),
        b"{nao-e-json".to_vec(),
        "application/json",
    )
    .await;
    assert_eq!(status, 400);

    let (status, body) = post(
        &format!("{}/v1/traces", q.otlp_url),
        LOTE,
        "application/json",
    )
    .await;
    assert_eq!(status, 200, "listener nao recuperou depois de input malformado: {body}");
    assert!(body["heraclitus"]["accepted"].as_u64().unwrap_or(0) > 0);
}
'''
              p.write_text(text)

          # Add a one-second approval rule and an end-to-end expiration gate.
          p = Path('crates/heraclitus-agent-gateway/tests/gateway_end_to_end.rs')
          text = p.read_text()
          if 'pagamento-expira' not in text:
              marker = '''  - id: shell\n    match:\n      tool: exec\n    decision: deny\n'''
              rule = '''  - id: pagamento-expira\n    match:\n      tool: send_payment_short\n    decision: require_approval\n    approval:\n      roles: ["cfo"]\n      ttl_seconds: 1\n\n'''
              if marker not in text:
                  raise SystemExit('policy marker not found')
              text = text.replace(marker, rule + marker, 1)
          if 'aprovacao_expirada_nunca_toca_o_upstream' not in text:
              marker = '#[tokio::test]\nasync fn trafego_de_protocolo_nao_vira_evidencia() {'
              test = r'''#[tokio::test]
async fn aprovacao_expirada_nunca_toca_o_upstream() {
    let h = harness(GatewayMode::Enforce).await;
    let pedido = tool_call(
        "c-exp",
        "send_payment_short",
        serde_json::json!({ "amount": 75000, "account": "v1" }),
    );
    let (status, body) = post_json(
        &format!("{}/mcp", h.gateway_url),
        pedido.clone(),
        AGENT_HEADERS,
    )
    .await;
    assert_eq!(status, 202, "{body}");
    let approval_id = body["error"]["data"]["heraclitus"]["approval_id"]
        .as_str()
        .unwrap()
        .to_string();

    let (status, body) = post_json(
        &format!("{}/api/v1/agent/approvals/{approval_id}/approve", h.api_url),
        serde_json::json!({}),
        &[],
    )
    .await;
    assert_eq!(status, 200, "{body}");

    tokio::time::sleep(std::time::Duration::from_millis(1_100)).await;
    let antes = h.hits();
    let (status, body) = post_json(&format!("{}/mcp", h.gateway_url), pedido, AGENT_HEADERS).await;
    assert_eq!(h.hits(), antes, "aprovacao expirada chegou ao upstream");
    assert!(status == 403 || status == 202, "status {status}: {body}");
    let reason = body["error"]["data"]["heraclitus"]["reason_code"]
        .as_str()
        .unwrap_or_default();
    assert_eq!(reason, "APPROVAL_EXPIRED", "{body}");
}

'''
              if marker not in text:
                  raise SystemExit('gateway test insertion marker not found')
              text = text.replace(marker, test + marker, 1)
          p.write_text(text)
          PY

      - name: Remove vulnerable Ratatui dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          cargo update -p ratatui --precise 0.30.2
          if cargo tree -i lru > /tmp/lru-tree.txt 2>&1; then
            cat /tmp/lru-tree.txt
            echo 'lru remains in the resolved dependency graph' >&2
            exit 1
          else
            cat /tmp/lru-tree.txt || true
            echo 'lru removed from the resolved dependency graph'
          fi

      - name: Format and focused security regressions
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo test -p heraclitus-cli
          cargo test -p heraclitus-agent-gateway --test quickstart_otlp
          cargo test -p heraclitus-agent-gateway --test gateway_end_to_end
          cargo clippy -p heraclitus-cli --all-targets -- -D warnings

      - name: RustSec must be green except documented risk acceptances
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071

      - name: Commit qualified corrective pass
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/spec-0078-finalize-trigger
          rm -f .github/workflows/spec-0078-finalize.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec-0078): close agent security and supply-chain regressions'
          git push origin HEAD:gpt56/spec-0078-agent-hardening
