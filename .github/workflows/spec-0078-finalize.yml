name: SPEC-0078 final qualification pass

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/spec-0078-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Apply final SPEC-0078 fixes
        run: python3 .github/spec0078_finalize.py

      - name: Remove vulnerable Ratatui dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          cargo update -p ratatui --precise 0.30.2
          if cargo tree -i lru > /tmp/lru-tree.txt 2>&1; then
            cat /tmp/lru-tree.txt
            echo 'lru remains in the resolved dependency graph' >&2
            exit 1
          else
            cat /tmp/lru-tree.txt || true
            echo 'lru removed from the resolved dependency graph'
          fi

      - name: Format and focused security regressions
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo test -p heraclitus-cli
          cargo test -p heraclitus-agent-gateway --test quickstart_otlp
          cargo test -p heraclitus-agent-gateway --test gateway_end_to_end
          cargo clippy -p heraclitus-cli --all-targets -- -D warnings

      - name: RustSec must be green except documented risk acceptances
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071

      - name: Commit qualified corrective pass
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/spec-0078-finalize-trigger
          rm -f .github/spec0078_finalize.py
          rm -f .github/workflows/spec-0078-finalize.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec-0078): close agent security and supply-chain regressions'
          git push origin HEAD:gpt56/agent-security-observability
