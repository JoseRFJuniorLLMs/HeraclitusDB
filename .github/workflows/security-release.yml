name: Emergency security release

# SPEC-0049 §92 — the dedicated pipeline for a security fix:
#   security branch -> minimal patch -> regression -> targeted qualification
#   -> sign -> release
#
# It is a separate workflow and not a flag on the normal release because the
# ordinary release gates are slow by design, and a Critical advisory cannot
# wait for a 24-hour soak. What it must NOT do is skip the things that make the
# artifact trustworthy, so the digests, SBOM and provenance are identical to the
# ordinary path. The only thing narrowed is the qualification scope, and §102
# still applies: this produces a patched build, not a new GovernmentProduction
# qualification. That requires re-running the full plan.

on:
  workflow_dispatch:
    inputs:
      advisory_id:
        description: Internal advisory or CVE identifier
        required: true
        type: string
      severity:
        description: Severity assessed against real deployment impact (§88)
        required: true
        type: choice
        options: [low, medium, high, critical]
      release_version:
        description: Version of the security release
        required: true
        type: string
      regression_test:
        description: >-
          Test filter proving the vulnerability cannot return (§93). Required
          for high and critical.
        required: false
        type: string
      regression_waiver:
        description: >-
          Why a regression test is not technically possible. §93 allows the
          exception; it does not allow silence.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  guard:
    name: Preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed_files: ${{ steps.diff.outputs.changed_files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: The fix must live on a security branch
        shell: bash
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF" in
            security/*) echo "branch: $REF" ;;
            *) echo "::error::emergency releases run from security/* branches, not $REF"; exit 1 ;;
          esac

      - name: A high or critical fix carries a regression test or a written waiver
        shell: bash
        env:
          SEVERITY: ${{ inputs.severity }}
          TEST: ${{ inputs.regression_test }}
          WAIVER: ${{ inputs.regression_waiver }}
        run: |
          set -euo pipefail
          if [ "$SEVERITY" = "high" ] || [ "$SEVERITY" = "critical" ]; then
            if [ -z "$TEST" ] && [ -z "$WAIVER" ]; then
              echo "::error::§93 — supply regression_test, or regression_waiver explaining why none is technically possible"
              exit 1
            fi
          fi

      - name: Measure the patch against the default branch
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.event.repository.default_branch }}"
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          changed="$(git diff --name-only "$base"...HEAD | wc -l | tr -d ' ')"
          echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
          git diff --stat "$base"...HEAD | tee patch.diffstat
          # §92 asks for a *minimal* patch. A sprawling diff is not forbidden,
          # but it stops being an emergency patch and belongs in a normal
          # release, so it is surfaced loudly rather than waved through.
          if [ "$changed" -gt 25 ]; then
            echo "::warning::$changed files changed; this is no longer a minimal patch — justify it in the advisory or use the normal release path"
          fi

      - name: A test file must move when a regression test is claimed
        if: inputs.regression_test != ''
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.event.repository.default_branch }}"
          if ! git diff --name-only "$base"...HEAD | grep -Eq '(^|/)tests?/|_test\.rs$|/fuzz/'; then
            echo "::error::regression_test was given but the patch changes no test or fuzz file"
            exit 1
          fi

  regression:
    name: Regression and targeted qualification
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: The named regression test must pass
        if: inputs.regression_test != ''
        run: cargo test --workspace --all-features --locked -- --exact --nocapture "${{ inputs.regression_test }}"

      - name: Full suite — a security fix may not trade one defect for another
        run: cargo test --workspace --all-features --locked

      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: RustSec must be clean for the advisory being fixed
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0436

      - name: Crash-safety preflight against the patched binary
        run: |
          cargo build --release --locked -p heraclitus-server -p heraclitus-qualifier
          ./target/release/heraclitus-qualifier crash-loop \
            --server-binary ./target/release/heraclitus-server \
            --root "$RUNNER_TEMP/crash-run" \
            --cycles 10 --concurrency 4 --durability always \
            --report "$RUNNER_TEMP/crash-report.json"

      - name: Configuration qualification of the reference config
        run: ./target/release/heraclitus-qualifier doctor --config qa/qualification/configs/reference-loopback.toml

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: security-${{ inputs.advisory_id }}-qualification
          if-no-files-found: error
          path: ${{ runner.temp }}/crash-report.json

  sign:
    name: Reproducible build, SBOM and provenance
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build twice and require the same bytes
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CARGO_TARGET_DIR="$RUNNER_TEMP/a" cargo build --release --locked -p heraclitus-server -p heraclitus-qualifier
          CARGO_TARGET_DIR="$RUNNER_TEMP/b" cargo build --release --locked -p heraclitus-server -p heraclitus-qualifier
          cmp "$RUNNER_TEMP/a/release/heraclitus-server" "$RUNNER_TEMP/b/release/heraclitus-server"
          cmp "$RUNNER_TEMP/a/release/heraclitus-qualifier" "$RUNNER_TEMP/b/release/heraclitus-qualifier"

      - name: Assemble the security payload
        id: payload
        shell: bash
        env:
          VERSION: ${{ inputs.release_version }}
          ADVISORY: ${{ inputs.advisory_id }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          dist="$RUNNER_TEMP/heraclitus-${VERSION}-security"
          mkdir -p "$dist/bin" "$dist/sbom" "$dist/security"
          cp "$RUNNER_TEMP/a/release/heraclitus-server" "$dist/bin/"
          cp "$RUNNER_TEMP/a/release/heraclitus-qualifier" "$dist/bin/"
          cp SECURITY.md docs/security/vulnerability-response.md "$dist/security/"
          cp Cargo.lock "$dist/"
          "$dist/bin/heraclitus-qualifier" sbom --out "$dist/sbom/bom.cdx.json"
          jq -n \
            --arg release "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg advisory "$ADVISORY" \
            --arg severity "$SEVERITY" \
            --arg regression "${{ inputs.regression_test }}" \
            --arg waiver "${{ inputs.regression_waiver }}" \
            --arg changed "${{ needs.guard.outputs.changed_files }}" \
            --arg source_date_epoch "$source_date_epoch" \
            '{schema_version:1,kind:"emergency_security_release",release_version:$release,
              git_commit:$commit,advisory_id:$advisory,severity:$severity,
              regression_test:$regression,regression_waiver:$waiver,
              changed_files:($changed|tonumber),source_date_epoch:$source_date_epoch,
              qualification_scope:"targeted; not a GovernmentProduction qualification (SPEC-0049 §102)"}' \
            > "$dist/security-release-manifest.json"
          (cd "$dist" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$(basename "$dist").tar.gz" "$(basename "$dist")"
          sha256sum "$RUNNER_TEMP/$(basename "$dist").tar.gz" > "$RUNNER_TEMP/$(basename "$dist").tar.gz.sha256"
          echo "archive=$RUNNER_TEMP/$(basename "$dist").tar.gz" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - name: Sigstore provenance for the security payload
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ steps.payload.outputs.archive }}
            ${{ steps.payload.outputs.dist }}/sbom/bom.cdx.json

      - name: Preserve the attestation bundle beside the payload
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ARCHIVE: ${{ steps.payload.outputs.archive }}
        run: cp "$BUNDLE_PATH" "$ARCHIVE.sigstore.json"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: heraclitus-${{ inputs.release_version }}-security
          if-no-files-found: error
          path: |
            ${{ steps.payload.outputs.archive }}
            ${{ steps.payload.outputs.archive }}.sha256
            ${{ steps.payload.outputs.archive }}.sigstore.json
            ${{ steps.payload.outputs.dist }}/security-release-manifest.json
            ${{ steps.payload.outputs.dist }}/sbom/bom.cdx.json
