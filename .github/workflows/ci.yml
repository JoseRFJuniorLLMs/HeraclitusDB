name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A action publica o resultado no proprio PR; com contents:read apenas,
    # falha com 403 em qualquer pull_request — e um job vermelho chamado
    # "secrets" e exatamente o alarme que ninguem quer ver falso.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy — workspace, targets e features (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: tests — workspace e todas as features
        run: cargo test --workspace --all-features --locked
      - name: build check — gpu feature (wgpu dispatch; CI has no GPU, build only)
        run: cargo build -p heraclitus-server --features gpu --locked
      - name: crash-injection gate (M0)
        run: cargo test -p heraclitus-log --test crash_injection --locked -- --nocapture
        env:
          CRASH_ITERS: "1000"
      - name: format compat gate (v2/v3/v4 read-path)
        run: cargo test -p heraclitus-log --test v2_compat --locked

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: prove rkyv advisory is not in the resolved build graph
        shell: bash
        run: |
          if cargo tree --workspace --all-features -i rkyv 2>/dev/null | grep -q rkyv; then
            echo "rkyv entrou no grafo compilado; a exceção RustSec não é mais válida"
            exit 1
          fi
      - name: RustSec — deny every finding except documented risk acceptances
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2024-0436

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: install SDK and quality gates
        run: python -m pip install --upgrade pip ruff pip-audit && python -m pip install -e './sdk/python[dev]'
      - name: protobuf generated-code drift
        run: |
          python sdk/python/generate_proto.py
          git diff --exit-code -- sdk/python/heraclitusdb/heraclitus_pb2.py sdk/python/heraclitusdb/heraclitus_pb2_grpc.py
      - name: lint and format
        working-directory: sdk/python
        run: ruff check . && ruff format --check .
      - name: tests
        working-directory: sdk/python
        run: pytest -q
      - name: dependency audit
        run: pip-audit --strict ./sdk/python

  windows-ops:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: backup, verify and restore on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'heraclitus-backup-smoke'
          $source = Join-Path $root 'source'
          $backups = Join-Path $root 'backups'
          $restore = Join-Path $root 'restore'
          New-Item -ItemType Directory -Path (Join-Path $source 'log') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $source 'views') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $source 'log\segment.bin') -Value 'segment-test' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $source 'views\state.chk') -Value 'view-test' -Encoding UTF8

          & .\windows\heraclitus-backup.ps1 backup -Source $source -BackupRoot $backups -Offline
          $found = @(Get-ChildItem -LiteralPath $backups -Directory)
          if ($found.Count -ne 1) { throw "esperado um backup; encontrados=$($found.Count)" }
          $backup = $found[0]
          & .\windows\heraclitus-backup.ps1 verify -BackupPath $backup.FullName -Offline
          & .\windows\heraclitus-backup.ps1 restore -BackupPath $backup.FullName -Destination $restore -Offline

          # O log tem de voltar byte a byte.
          foreach ($relative in @('log\segment.bin')) {
              $expected = (Get-FileHash -LiteralPath (Join-Path $source $relative) -Algorithm SHA256).Hash
              $actual = (Get-FileHash -LiteralPath (Join-Path $restore $relative) -Algorithm SHA256).Hash
              if ($expected -ne $actual) { throw "restore divergiu: $relative" }
          }

          # As views NAO voltam, e e isso que se quer: sao estado derivado com
          # atributos em claro e reconstroem-se do log por replay determinista.
          # O passo exigia `views\state.chk` restaurado, o que contradizia a
          # politica do proprio script (heraclitus-backup.ps1: $excluded).
          # Passar a exigir a AUSENCIA prova a exclusao em vez de a negar.
          if (Test-Path -LiteralPath (Join-Path $restore 'views\state.chk')) {
              throw 'views restaurado: a exclusao de estado derivado deixou de valer'
          }

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly action
        with:
          toolchain: nightly-2026-02-17
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz log decode (10 min budget)
        run: cargo +nightly-2026-02-17 fuzz run log_decode -- -max_total_time=600
        working-directory: .
      - name: fuzz query parser (10 min budget, M4 gate)
        run: cargo +nightly-2026-02-17 fuzz run query_parser -- -max_total_time=600
        working-directory: .
      - name: fuzz manifold operations (10 min budget)
        run: cargo +nightly-2026-02-17 fuzz run manifold_ops -- -max_total_time=600
        working-directory: .
      - name: fuzz HRKL v6 decoders (10 min budget)
        run: cargo +nightly-2026-02-17 fuzz run v6_decode -- -max_total_time=600
        working-directory: .
      - name: fuzz configuration parser (5 min budget, SPEC-0049 §39)
        run: cargo +nightly-2026-02-17 fuzz run config_parse -- -max_total_time=300
        working-directory: .
      - name: fuzz RFC 3161 timestamp material (5 min budget, SPEC-0049 §39)
        run: cargo +nightly-2026-02-17 fuzz run rfc3161_decode -- -max_total_time=300
        working-directory: .
      - name: preserve any crash as regression corpus (SPEC-0049 §41)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-crash-artifacts
          if-no-files-found: ignore
          path: fuzz/artifacts/

  bench-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: criterion compile check (no run)
        run: cargo bench --workspace --no-run
