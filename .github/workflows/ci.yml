name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A action publica o resultado no proprio PR; com contents:read apenas,
    # falha com 403 em qualquer pull_request — e um job vermelho chamado
    # "secrets" e exatamente o alarme que ninguem quer ver falso.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: clippy — workspace, targets e features (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: tests — workspace e todas as features
        run: cargo test --workspace --all-features --locked
      - name: build check — gpu feature (wgpu dispatch; CI has no GPU, build only)
        run: cargo build -p heraclitus-server --features gpu --locked
      - name: crash-injection gate (M0)
        run: cargo test -p heraclitus-log --test crash_injection --locked -- --nocapture
        env:
          CRASH_ITERS: "1000"
      - name: format compat gate (v2/v3/v4 read-path)
        run: cargo test -p heraclitus-log --test v2_compat --locked
      # O `fmt` corre por ULTIMO e com `!cancelled()` de proposito. Enquanto foi
      # o primeiro passo, uma divergencia de formatacao abortava o job antes do
      # clippy — e um `error[E0433]` real ficou 12 dias invisivel atras de um
      # vermelho cosmetico. Um gate mecanico nunca pode mascarar um gate
      # semantico: continua a reprovar o job, mas so depois de compilar e testar.
      - name: fmt (nao mascara os gates acima)
        if: '!cancelled()'
        run: cargo fmt --all --check

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: prove rkyv advisory is not in the resolved build graph
        shell: bash
        run: |
          if cargo tree --workspace --all-features -i rkyv 2>/dev/null | grep -q rkyv; then
            echo "rkyv entrou no grafo compilado; a exceção RustSec não é mais válida"
            exit 1
          fi
      - name: prove the RSA private-key path stays out of production builds
        shell: bash
        run: |
          # RUSTSEC-2023-0071 (Marvin) e um sidechannel de temporizacao nas
          # operacoes com a chave PRIVADA. Nao ha upgrade: o `rsa` 0.9.10 e a
          # ultima versao publicada. A excecao so e legitima enquanto o binario
          # de producao nunca tocar numa chave privada RSA — hoje so verifica
          # assinaturas (RsaPublicKey + SignatureScheme::verify) e a unica
          # chave privada vive no `test_pki`, atras de `#[cfg(test)]`.
          #
          # Estes dois testes transformam essa afirmacao em algo que a maquina
          # confere. Se alguem acrescentar assinatura RSA ao servidor, o gate
          # cai aqui em vez de a excecao envelhecer em silencio.
          if ! grep -A1 '^#\[cfg(test)\]$' crates/heraclitus-compliance/src/lib.rs | grep -q 'mod test_pki;'; then
            echo "test_pki deixou de estar atras de #[cfg(test)]: chave privada RSA pode entrar em producao"
            exit 1
          fi
          fora=$(grep -rln -E 'RsaPrivateKey|rsa::pkcs1v15::SigningKey|rsa::pss::SigningKey|rsa::pkcs8::DecodePrivateKey' \
                   crates tools --include='*.rs' | grep -v '^crates/heraclitus-compliance/src/test_pki.rs$' || true)
          if [ -n "$fora" ]; then
            echo "API de chave privada RSA fora do test_pki; RUSTSEC-2023-0071 passa a ser exploravel:"
            echo "$fora"
            exit 1
          fi
      - name: RustSec — deny every finding except documented risk acceptances
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2023-0071

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: install SDK and quality gates
        run: python -m pip install --upgrade pip ruff pip-audit && python -m pip install -e './sdk/python[dev]'
      - name: protobuf generated-code drift
        run: |
          python sdk/python/generate_proto.py
          git diff --exit-code -- sdk/python/heraclitusdb/heraclitus_pb2.py sdk/python/heraclitusdb/heraclitus_pb2_grpc.py
      - name: lint and format
        working-directory: sdk/python
        run: ruff check . && ruff format --check .
      - name: tests
        working-directory: sdk/python
        run: pytest -q
      - name: dependency audit
        run: pip-audit --strict ./sdk/python

  windows-ops:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: backup, verify and restore on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'heraclitus-backup-smoke'
          $source = Join-Path $root 'source'
          $backups = Join-Path $root 'backups'
          $restore = Join-Path $root 'restore'
          New-Item -ItemType Directory -Path (Join-Path $source 'log') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $source 'views') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $source 'log\segment.bin') -Value 'segment-test' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $source 'views\state.chk') -Value 'view-test' -Encoding UTF8

          & .\windows\heraclitus-backup.ps1 backup -Source $source -BackupRoot $backups -Offline
          $found = @(Get-ChildItem -LiteralPath $backups -Directory)
          if ($found.Count -ne 1) { throw "esperado um backup; encontrados=$($found.Count)" }
          $backup = $found[0]
          & .\windows\heraclitus-backup.ps1 verify -BackupPath $backup.FullName -Offline
          & .\windows\heraclitus-backup.ps1 restore -BackupPath $backup.FullName -Destination $restore -Offline

          # O log tem de voltar byte a byte.
          foreach ($relative in @('log\segment.bin')) {
              $expected = (Get-FileHash -LiteralPath (Join-Path $source $relative) -Algorithm SHA256).Hash
              $actual = (Get-FileHash -LiteralPath (Join-Path $restore $relative) -Algorithm SHA256).Hash
              if ($expected -ne $actual) { throw "restore divergiu: $relative" }
          }

          # As views NAO voltam, e e isso que se quer: sao estado derivado com
          # atributos em claro e reconstroem-se do log por replay determinista.
          # O passo exigia `views\state.chk` restaurado, o que contradizia a
          # politica do proprio script (heraclitus-backup.ps1: $excluded).
          # Passar a exigir a AUSENCIA prova a exclusao em vez de a negar.
          if (Test-Path -LiteralPath (Join-Path $restore 'views\state.chk')) {
              throw 'views restaurado: a exclusao de estado derivado deixou de valer'
          }

  # SPEC-0072 §29-§36 — qualificação OPERACIONAL do arranque em Linux.
  #
  # A §29 justifica este job numa linha: "CI Linux existente não é qualificação
  # operacional". O `lint-test` acima prova a lógica; não prova que um PROCESSO
  # arranca, serve, recebe SIGTERM, morre de SIGKILL e volta. São coisas
  # diferentes, e à primeira corrida esta apanhou duas que a outra não podia
  # apanhar: a configuração de referência que distribuímos não parseava, e sob
  # `cursor_policy=strict` o servidor arrancava na mesma com a detecção
  # desligada.
  #
  # Fica no CI por PR, e não no nightly, porque estes são gates de CORRECÇÃO —
  # um gate de correcção que só corre de noite encontra a regressão um dia
  # depois de ela entrar. O L7 (escala, base grande) é que pertence ao nightly.
  linux-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: gates operacionais L0-L6 (arranque, SIGTERM, SIGKILL, cursor, snapshot)
        run: bash scripts/linux-gates.sh

  # Este job pedia 50 minutos de fuzzing (10+10+10+10+5+5) dentro de um
  # `timeout-minutes: 35`, mais o `cargo install cargo-fuzz` e seis builds de
  # target. Nunca podia passar: era vermelho por aritmética, não por defeito
  # encontrado — e um gate que nunca fica verde deixa de ser lido, que é a
  # única coisa pior do que não ter gate nenhum. O budget longo mudou-se para
  # o job `fuzz-deep` do qualification-nightly, onde tem tempo a sério; aqui
  # fica o passe de fumo que cabe no tempo e apanha a regressão óbvia por PR.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: false
    env:
      FUZZ_SMOKE_SECS: "60"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly action
        with:
          toolchain: nightly-2026-02-17
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz log decode (smoke)
        run: cargo +nightly-2026-02-17 fuzz run log_decode -- -max_total_time=$FUZZ_SMOKE_SECS
      - name: fuzz query parser (smoke, M4 gate)
        run: cargo +nightly-2026-02-17 fuzz run query_parser -- -max_total_time=$FUZZ_SMOKE_SECS
      - name: fuzz manifold operations (smoke)
        run: cargo +nightly-2026-02-17 fuzz run manifold_ops -- -max_total_time=$FUZZ_SMOKE_SECS
      - name: fuzz HRKL v6 decoders (smoke)
        run: cargo +nightly-2026-02-17 fuzz run v6_decode -- -max_total_time=$FUZZ_SMOKE_SECS
      - name: fuzz configuration parser (smoke, SPEC-0049 §39)
        run: cargo +nightly-2026-02-17 fuzz run config_parse -- -max_total_time=$FUZZ_SMOKE_SECS
      - name: fuzz RFC 3161 timestamp material (smoke, SPEC-0049 §39)
        run: cargo +nightly-2026-02-17 fuzz run rfc3161_decode -- -max_total_time=$FUZZ_SMOKE_SECS
      - name: preserve any crash as regression corpus (SPEC-0049 §41)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-crash-artifacts
          if-no-files-found: ignore
          path: fuzz/artifacts/

  bench-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: criterion compile check (no run)
        run: cargo bench --workspace --no-run
