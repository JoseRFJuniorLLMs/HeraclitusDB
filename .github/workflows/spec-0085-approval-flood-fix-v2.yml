name: SPEC-0085 approval flood containment v2

on:
  push:
    branches: [gpt56/agent-security-observability]

permissions:
  contents: write

jobs:
  implement-format-qualify:
    if: ${{ !contains(github.event.head_commit.message, 'fix(spec-0085)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Extract and apply the already-reviewed SPEC-0085 patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/spec-0085-approval-flood-fix.yml').read_text()
          marker = '      - name: Apply SPEC-0085 implementation\n'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          run_start = workflow.index(run_marker, start) + len(run_marker)
          end = workflow.index('\n      - name: Format and focused qualification', run_start)
          block = workflow[run_start:end]
          script = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script.append(line[10:])
              elif not line.strip():
                  script.append('')
              else:
                  raise SystemExit(f'unexpected indentation in extracted patch: {line!r}')
          patcher = Path('/tmp/apply_spec0085.py')
          patcher.write_text('\n'.join(script) + '\n')
          subprocess.run(['python3', str(patcher)], check=True)

      - name: Format before qualification
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Focused security qualification
        run: |
          cargo test -p heraclitus-agent spec_0085_capacity_tests -- --nocapture
          cargo test -p heraclitus-agent-gateway --all-targets
          cargo clippy -p heraclitus-agent -p heraclitus-agent-gateway --all-targets -- -D warnings

      - name: Commit qualified implementation and remove one-shot workflows
        run: |
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/spec-0085-approval-flood-fix.yml
          git rm .github/workflows/spec-0085-approval-flood-fix-v2.yml
          git add crates/heraclitus-agent/src/config.rs \
                  crates/heraclitus-agent/src/action.rs \
                  crates/heraclitus-agent-gateway/src/runtime.rs \
                  crates/heraclitus-agent-gateway/src/gateway.rs \
                  docs/md/SPEC-new/SPEC-0085-Approval-Flood-Containment.md
          git commit -m 'fix(spec-0085): bound approval flood state atomically'
          git push origin HEAD:gpt56/agent-security-observability
