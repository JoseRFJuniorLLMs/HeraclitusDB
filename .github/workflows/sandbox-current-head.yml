name: Sandbox current-head red-team build

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/workflows/sandbox-current-head.yml
      - crates/heraclitus-agent/**
      - crates/heraclitus-agent-gateway/**
      - crates/heraclitus-server/**
      - labs/Agent-Atack-Heraclitus/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Focused security regression tests
        run: |
          cargo test -p heraclitus-agent mcp::tests -- --nocapture
          cargo test -p heraclitus-agent-gateway
      - name: Build release server
        run: cargo build --release --locked -p heraclitus-server
      - name: Package exact head and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/heraclitus-server dist/
          cp -R labs/Agent-Atack-Heraclitus dist/
          git rev-parse HEAD > dist/COMMIT
          sha256sum dist/heraclitus-server > dist/SHA256SUMS
          git archive --format=tar.gz --prefix=HeraclitusDB/ -o dist/heraclitus-source.tar.gz HEAD
          sha256sum dist/heraclitus-source.tar.gz >> dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heraclitus-sandbox-current-head
          path: dist/
          if-no-files-found: error
          retention-days: 1
