name: Sandbox final head build
on:
  push:
    branches: [gpt56/agent-security-observability]
    paths:
      - '.github/workflows/sandbox-final-head-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Build release server
        run: cargo build --release -p heraclitus-server
      - name: Package exact build
        run: |
          set -euo pipefail
          mkdir -p dist/Agent-Atack-Heraclitus
          cp target/release/heraclitus-server dist/heraclitus-server
          cp labs/Agent-Atack-Heraclitus/*.py dist/Agent-Atack-Heraclitus/
          cp labs/Agent-Atack-Heraclitus/config.example.json dist/Agent-Atack-Heraclitus/
          cp labs/Agent-Atack-Heraclitus/README.md dist/Agent-Atack-Heraclitus/
          git rev-parse HEAD > dist/COMMIT
          sha256sum dist/heraclitus-server > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: heraclitus-final-head-sandbox
          path: dist
          retention-days: 1
