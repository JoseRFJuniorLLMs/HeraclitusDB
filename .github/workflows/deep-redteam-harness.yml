name: Deep Red Team Harness

on:
  pull_request:
    paths:
      - "labs/Deep-RedTeam-Heraclitus/**"
      - "qa/qualification/matrices/attack-matrix.json"
      - "docs/qualification/runbooks/security-red-team.md"
  push:
    branches: [main]
    paths:
      - "labs/Deep-RedTeam-Heraclitus/**"
      - "qa/qualification/matrices/attack-matrix.json"

permissions:
  contents: read

jobs:
  harness-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runner
        run: python -m py_compile labs/Deep-RedTeam-Heraclitus/runner.py
      - name: Validate JSON configuration
        run: |
          python -m json.tool labs/Deep-RedTeam-Heraclitus/config.example.json > /dev/null
          python -m json.tool qa/qualification/matrices/attack-matrix.json > /dev/null
      - name: Safety and digest self-test
        run: python labs/Deep-RedTeam-Heraclitus/runner.py --self-test
