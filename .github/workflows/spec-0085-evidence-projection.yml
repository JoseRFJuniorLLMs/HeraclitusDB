name: SPEC-0085 bounded agent evidence projection
on:
  push:
    branches: [gpt56/agent-security-observability]
permissions:
  contents: write
jobs:
  implement-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Implement SPEC-0085 projection isolation
        shell: python
        run: |
          from pathlib import Path

          # 1) Generic views: AgentEvidence is canonical evidence-plane data,
          # not application graph/text/vector content. Skip it consistently in
          # live apply, catch-up and rebuild. We deliberately do NOT advance a
          # concrete view's internal watermark without calling that view: a
          # snapshot that claims to have applied an event it never saw would be
          # worse than replaying a harmless skipped tail on restart.
          p = Path('crates/heraclitus-views/src/lib.rs')
          s = p.read_text()
          s2 = s.replace(
              'use heraclitus_core::{Episode, HeraclitusError, Lsn};',
              'use heraclitus_core::{Episode, EventKind, HeraclitusError, Lsn};')
          assert s2 != s
          s = s2
          marker = '''pub trait View: Send + Sync {'''
          helper = '''fn is_agent_evidence(event: &Episode) -> bool {\n    matches!(&event.kind, EventKind::Custom(kind) if kind == "AgentEvidence")\n}\n\n/// AgentEvidence is canonical security-plane data. It remains in HRKL and is\n/// projected by the dedicated Agent APIs; generic views intentionally ignore\n/// it so a denied-action flood cannot become graph/text/activation RAM growth.\n'''
          assert helper.splitlines()[0] not in s
          s = s.replace(marker, helper + marker, 1)
          old = '''    pub fn apply(&mut self, lsn: Lsn, event: &Episode) {\n        if heraclitus_log::vm_bridge::is_hvm(event) {\n            return;\n        }\n        for (i, v) in self.views.iter_mut().enumerate() {'''
          new = '''    pub fn apply(&mut self, lsn: Lsn, event: &Episode) {\n        if heraclitus_log::vm_bridge::is_hvm(event) || is_agent_evidence(event) {\n            return;\n        }\n        for (i, v) in self.views.iter_mut().enumerate() {'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                if heraclitus_log::vm_bridge::is_hvm(ep) {\n                    continue;\n                }\n                for (i, v) in self.views.iter_mut().enumerate() {'''
          new = '''                if heraclitus_log::vm_bridge::is_hvm(ep) || is_agent_evidence(ep) {\n                    continue;\n                }\n                for (i, v) in self.views.iter_mut().enumerate() {'''
          assert s.count(old) == 2, s.count(old)
          s = s.replace(old, new)
          p.write_text(s)

          # 2) General AttrIndex: consume AgentEvidence only as a watermark.
          # No evidence_id/run/policy/tool postings are duplicated into the
          # application index. Dedicated Agent APIs scan/project authoritative
          # evidence from HRKL.
          p = Path('crates/heraclitus-index-attr/src/lib.rs')
          s = p.read_text()
          s2 = s.replace(
              'use heraclitus_core::{CanonicalKeyCodec, Episode, HeraclitusError, Lsn};',
              'use heraclitus_core::{CanonicalKeyCodec, Episode, EventKind, HeraclitusError, Lsn};')
          assert s2 != s
          s = s2
          old = '''    fn apply(&mut self, lsn: Lsn, event: &Episode) {\n        // Inserção ORDENADA com dedup por LSN'''
          new = '''    fn apply(&mut self, lsn: Lsn, event: &Episode) {\n        // SPEC-0085: AgentEvidence is already durably indexed by its dedicated\n        // evidence plane. Duplicating its high-cardinality envelope into the\n        // generic AttrIndex lets a denied-action flood allocate RAM without\n        // gaining any application-query capability. Consume the LSN so boot\n        // does not replay it forever, but create no generic postings.\n        if matches!(&event.kind, EventKind::Custom(kind) if kind == "AgentEvidence") {\n            self.inner.watermark = self.inner.watermark.max(lsn);\n            self.inner.applied = true;\n            return;\n        }\n\n        // Inserção ORDENADA com dedup por LSN'''
          assert old in s
          s = s.replace(old, new, 1)
          # permanent regression test
          needle = '''    #[test]\n    fn indexes_any_field_and_looks_up_fast() {'''
          test = '''    #[test]\n    fn agent_evidence_only_advances_watermark_without_generic_postings() {\n        let mut idx = AttrIndex::new();\n        let mut e = Episode::new(\n            "hostile-agent",\n            EventKind::Custom("AgentEvidence".into()),\n            br#"{\\"evidence_id\\":\\"synthetic\\"}"#.to_vec(),\n        );\n        e.attrs.insert("agent.evidence_id".into(), "unique-high-cardinality".into());\n        e.attrs.insert("agent.tool".into(), "exec".into());\n        idx.apply(77, &e);\n        assert_eq!(idx.watermark(), 77);\n        assert_eq!(idx.keys(), 0, "Agent evidence must stay out of generic AttrIndex");\n        assert!(idx.lookup("agent.tool", "exec").is_empty());\n        assert!(idx.lookup("_agent", "hostile-agent").is_empty());\n        assert!(idx.lookup("_kind", "AgentEvidence").is_empty());\n    }\n\n'''
          assert needle in s
          s = s.replace(needle, test + needle, 1)
          p.write_text(s)

          # 3) Engine memtable: do not retain the full evidence JSON in the
          # generic hot memtable. ViewRegistry/AttrIndex above still receive the
          # event so their deterministic skip/watermark semantics are applied.
          p = Path('crates/heraclitus-server/src/engine.rs')
          s = p.read_text()
          old = '''        self.memtable.apply(lsn, episode.clone());\n        self.views.lock().unwrap().apply(lsn, episode);\n        self.attr.write().unwrap().apply(lsn, episode);'''
          new = '''        let agent_evidence = matches!(\n            &episode.kind,\n            EventKind::Custom(kind) if kind == "AgentEvidence"\n        );\n        if !agent_evidence {\n            self.memtable.apply(lsn, episode.clone());\n        }\n        self.views.lock().unwrap().apply(lsn, episode);\n        self.attr.write().unwrap().apply(lsn, episode);'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Bring the SPEC wording in line with the conservative view-watermark
          # implementation: AttrIndex advances safely; opaque generic views do
          # not lie about having applied an event they skipped.
          p = Path('docs/md/SPEC-new/SPEC-0085-Bounded-Agent-Evidence-Under-Flood.md')
          s = p.read_text()
          s = s.replace(
              '- **still advance projection watermarks** so boot replay and checkpoints do not repeatedly scan already-consumed internal evidence.',
              '- for the general `AttrIndex`, **advance only its watermark** without creating postings; for opaque generic views, do not forge an internal watermark for state they never applied. A skipped evidence-only tail may therefore be rescanned on restart, which is bounded I/O and preserves snapshot truth.')
          p.write_text(s)
      - name: Format and focused tests
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test -p heraclitus-index-attr agent_evidence_only_advances_watermark_without_generic_postings -- --nocapture
          cargo test -p heraclitus-views --lib
          cargo test -p heraclitus-agent-gateway --all-features
          cargo test -p heraclitus-server agent_plane::tests -- --nocapture
      - name: Clippy focused crates
        run: cargo clippy -p heraclitus-index-attr -p heraclitus-views -p heraclitus-server -p heraclitus-agent-gateway --all-targets --all-features -- -D warnings
      - name: Build release server
        run: cargo build --release -p heraclitus-server
      - name: Commit implementation and remove one-shot workflow
        run: |
          rm .github/workflows/spec-0085-evidence-projection.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/heraclitus-views/src/lib.rs crates/heraclitus-index-attr/src/lib.rs crates/heraclitus-server/src/engine.rs docs/md/SPEC-new/SPEC-0085-Bounded-Agent-Evidence-Under-Flood.md .github/workflows/spec-0085-evidence-projection.yml
          git commit -m 'fix(spec-0085): isolate agent evidence from generic projections'
          git push origin HEAD:gpt56/agent-security-observability