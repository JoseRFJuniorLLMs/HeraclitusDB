name: SPEC-0079 agent security observability

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/spec-0079-trigger

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply SPEC-0079
        run: python3 scripts/spec0079_apply.py
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Focused tests
        run: |
          set -euxo pipefail
          cargo test -p heraclitus-agent-gateway --test gateway_end_to_end
          cargo test -p heraclitus-agent-gateway --test quickstart_otlp
          cargo test -p heraclitus-agent
          cargo clippy -p heraclitus-agent-gateway --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          set -euxo pipefail
          rm -f .github/spec-0079-trigger
          rm -f .github/workflows/spec-0079-agent-security-observability.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(spec-0079): persist and expose red-team evidence'
          git push origin HEAD:gpt56/agent-security-observability
