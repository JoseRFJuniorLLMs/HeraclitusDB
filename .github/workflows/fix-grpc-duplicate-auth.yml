name: Close duplicate gRPC authorization ambiguity
on:
  push:
    branches: [gpt56/agent-security-observability]
    paths: [.github/workflows/fix-grpc-duplicate-auth.yml]
permissions:
  contents: write
jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Patch duplicate Authorization fail-closed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/heraclitus-server/src/auth.rs')
          s=p.read_text()
          old='''        let token = req
            .metadata()
            .get("authorization")
            .and_then(|v| v.to_str().ok())
            .and_then(|v| v.strip_prefix("Bearer "))
            .map(str::to_owned);
'''
          new='''        // Authentication metadata is security-sensitive and therefore must be
        // unambiguous. Different HTTP/2 intermediaries may disagree about how
        // repeated Authorization fields are combined; accepting the first one
        // would make authentication depend on header order. Fail closed unless
        // there is exactly one value (or none in an explicitly open profile).
        let token = {
            let mut values = req.metadata().get_all("authorization").iter();
            let first = values.next();
            if values.next().is_some() {
                return Err(Status::unauthenticated(
                    "multiple authorization metadata values are not allowed",
                ));
            }
            first
                .and_then(|v| v.to_str().ok())
                .and_then(|v| v.strip_prefix("Bearer "))
                .map(str::to_owned)
        };
'''
          if old not in s: raise SystemExit('authenticate block not found')
          s=s.replace(old,new,1)
          marker='''    #[test]
    fn authenticates_hashed_token_and_enforces_roles() {'''
          if marker not in s: raise SystemExit('test marker not found')
          test='''    #[test]
    fn duplicate_authorization_metadata_is_rejected_in_both_orders() {
        let token = "0123456789abcdef0123456789abcdef"; // gitleaks:allow -- unit-test vector
        let mut cfg = HeraclitusConfig::default();
        cfg.auth_token = Some(token.into());
        let auth = Authenticator::from_config(&cfg).unwrap();

        for values in [
            [format!("Bearer {token}"), "Bearer wrong".to_string()],
            ["Bearer wrong".to_string(), format!("Bearer {token}")],
        ] {
            let mut req = Request::new(());
            req.metadata_mut()
                .append("authorization", values[0].parse().unwrap());
            req.metadata_mut()
                .append("authorization", values[1].parse().unwrap());
            let err = auth.authenticate(req).unwrap_err();
            assert_eq!(err.code(), tonic::Code::Unauthenticated);
            assert!(err.message().contains("multiple authorization"));
        }
    }

'''
          s=s.replace(marker,test+marker,1)
          p.write_text(s)
          PY
          cargo fmt -- crates/heraclitus-server/src/auth.rs
      - name: Targeted auth regression
        run: cargo test -p heraclitus-server duplicate_authorization_metadata_is_rejected_in_both_orders
      - name: Commit source fix
        run: |
          git config user.name "GPT-5.6 Sol"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-grpc-duplicate-auth.yml
          git add crates/heraclitus-server/src/auth.rs
          git commit -m "fix(auth): reject duplicate gRPC authorization metadata"
          git push origin HEAD:gpt56/agent-security-observability
      - name: Build corrected release server
        run: |
          cargo build --release -p heraclitus-server
          cp target/release/heraclitus-server ./heraclitus-server
          git rev-parse HEAD > COMMIT
          sha256sum heraclitus-server > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: heraclitus-grpc-auth-fixed
          path: |
            heraclitus-server
            COMMIT
            SHA256SUMS
          retention-days: 1
