name: Document Security Gate

on:
  push:
    paths:
      - 'crates/heraclitus-sentinel/src/document_security.rs'
      - 'crates/heraclitus-sentinel/src/lib.rs'
      - 'crates/heraclitus-sentinel/Cargo.toml'
      - 'docs/md/SPEC-new/SPEC-0092-DOCUMENT-LLM-INJECTION-FIREWALL.md'
      - '.github/workflows/document-security.yml'
  pull_request:
    paths:
      - 'crates/heraclitus-sentinel/src/document_security.rs'
      - 'crates/heraclitus-sentinel/src/lib.rs'
      - 'crates/heraclitus-sentinel/Cargo.toml'
      - 'docs/md/SPEC-new/SPEC-0092-DOCUMENT-LLM-INJECTION-FIREWALL.md'
      - '.github/workflows/document-security.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: rustfmt changed Sentinel surface
        run: rustfmt --edition 2021 --check crates/heraclitus-sentinel/src/document_security.rs
      - name: check Sentinel
        run: cargo check -p heraclitus-sentinel
      - name: document-security tests
        run: cargo test -p heraclitus-sentinel document_security::tests
      - name: clippy Sentinel library
        run: cargo clippy -p heraclitus-sentinel --lib -- -D warnings
