name: Sandbox HEAD build

on:
  push:
    branches: [gpt56/agent-security-observability]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Build exact release server
        run: cargo build --release --locked -p heraclitus-server
      - name: Package sandbox artifact
        run: |
          mkdir -p out/Agent-Atack-Heraclitus
          cp target/release/heraclitus-server out/
          cp -a labs/Agent-Atack-Heraclitus/. out/Agent-Atack-Heraclitus/
          git rev-parse HEAD > out/COMMIT
          sha256sum target/release/heraclitus-server > out/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heraclitus-sandbox-head
          path: out/
          retention-days: 1
