name: SPEC-0079 CRLF gate repair

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - '.github/workflows/spec0079-fix-ci-crlf.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - name: Repair and self-test gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          raw = p.read_text()
          old = "if ! grep -A1 '^#\\[cfg(test)\\]$' crates/heraclitus-compliance/src/lib.rs | grep -q 'mod test_pki;'; then"
          new = "if ! tr -d '\\r' < crates/heraclitus-compliance/src/lib.rs | grep -A1 '^#\\[cfg(test)\\]$' | grep -q 'mod test_pki;'; then"
          if old not in raw:
              raise SystemExit('expected RSA gate line not found')
          p.write_text(raw.replace(old, new, 1))
          PY
          tr -d '\r' < crates/heraclitus-compliance/src/lib.rs | grep -A1 '^#\[cfg(test)\]$' | grep -q 'pub(crate) mod test_pki;'
          fora=$(grep -rln -E 'RsaPrivateKey|rsa::pkcs1v15::SigningKey|rsa::pss::SigningKey|rsa::pkcs8::DecodePrivateKey' crates tools --include='*.rs' | grep -v '^crates/heraclitus-compliance/src/test_pki.rs$' || true)
          test -z "$fora"
      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec0079-fix-ci-crlf.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/spec0079-fix-ci-crlf.yml
          git commit -m 'ci: make RSA test-boundary gate CRLF-safe'
          git push origin HEAD:gpt56/agent-security-observability
