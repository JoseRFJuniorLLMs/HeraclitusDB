name: SPEC-0082 durable approval replay
on:
  push:
    branches: [gpt56/agent-security-observability]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply durable replay fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ApprovalStore: durable consumed-subject ledger that can be warmed from HRKL.
          p=Path('crates/heraclitus-agent/src/action.rs')
          s=p.read_text()
          s=s.replace('''pub struct ApprovalStore {\n    inner: Mutex<BTreeMap<String, ApprovalRecord>>,\n}''','''pub struct ApprovalStore {\n    inner: Mutex<BTreeMap<String, ApprovalRecord>>,\n    /// Assuntos já consumidos reconstruídos do HRKL. Separado dos records\n    /// vivos porque uma execução antiga não precisa de preview/TTL para ser\n    /// reconhecida como replay, apenas do subject hash e approval id.\n    consumed_subjects: Mutex<BTreeMap<String, String>>,\n}''',1)

          old='''        let Some((id, record)) = map\n            .iter_mut()\n            .find(|(_, r)| r.request.authorization_subject_hash == presented)\n            .map(|(k, v)| (k.clone(), v))\n        else {'''
          new='''        let Some((id, record)) = map\n            .iter_mut()\n            .find(|(_, r)| r.request.authorization_subject_hash == presented)\n            .map(|(k, v)| (k.clone(), v))\n        else {\n            if let Some(approval_id) = self.consumed_subjects.lock().unwrap().get(&presented).cloned() {\n                return ApprovalVerdict::AlreadyUsed { approval_id };\n            }'''
          assert old in s
          s=s.replace(old,new,1)

          old='''                record.state = ApprovalState::Consumed;\n                record.authorization = Some(authorization.clone());\n                ApprovalVerdict::Authorized { approval_id: id }'''
          new='''                record.state = ApprovalState::Consumed;\n                record.authorization = Some(authorization.clone());\n                self.consumed_subjects\n                    .lock()\n                    .unwrap()\n                    .insert(presented, id.clone());\n                ApprovalVerdict::Authorized { approval_id: id }'''
          assert old in s
          s=s.replace(old,new,1)

          marker='''    /// Reconstrói o índice a partir de registos já persistidos.\n    pub fn warm(&self, records: impl IntoIterator<Item = ApprovalRecord>) {'''
          assert marker in s
          insert='''    /// Reconstrói o ledger mínimo de approvals já consumidos.\n    /// Chamado no arranque a partir de evidências `ToolAuthorized` duráveis.\n    pub fn warm_consumed(\n        &self,\n        records: impl IntoIterator<Item = (String, String)>,\n    ) {\n        let mut consumed = self.consumed_subjects.lock().unwrap();\n        for (subject_hash, approval_id) in records {\n            consumed.insert(subject_hash, approval_id);\n        }\n    }\n\n'''
          s=s.replace(marker,insert+marker,1)

          # Unit test durable replay ledger.
          needle='''    #[test]\n    fn operacao_identica_nova_pode_pedir_nova_aprovacao_apos_consumo() {'''
          test='''    #[test]\n    fn replay_consumido_reconstruido_do_log_continua_bloqueado() {\n        let store = ApprovalStore::new();\n        let a = authz("5000");\n        store.warm_consumed([(a.subject_hash(), "A-durable".to_string())]);\n        assert!(matches!(\n            store.consume(&a, 200),\n            ApprovalVerdict::AlreadyUsed { approval_id } if approval_id == "A-durable"\n        ));\n    }\n\n'''
          assert needle in s
          s=s.replace(needle,test+needle,1)
          p.write_text(s)

          # Runtime warm: recover consumed subjects from ToolAuthorized evidence.
          p=Path('crates/heraclitus-agent-gateway/src/runtime.rs')
          s=p.read_text()
          old='''        let mut idx = self.dedupe.lock().unwrap();\n        idx.warm_from(rows.iter().map(|r| &r.evidence));\n        self.approvals.warm(Vec::new());\n        Ok(rows.len())'''
          new='''        let mut idx = self.dedupe.lock().unwrap();\n        idx.warm_from(rows.iter().map(|r| &r.evidence));\n        self.approvals.warm(Vec::new());\n        self.approvals.warm_consumed(rows.iter().filter_map(|row| {\n            let e = &row.evidence;\n            if e.kind != heraclitus_agent::evidence::AgentEvidenceKindV1::ToolAuthorized {\n                return None;\n            }\n            let approval = e.content.approval.as_ref()?;\n            Some((\n                approval.authorization_subject_hash.clone(),\n                approval.approval_id.clone(),\n            ))\n        }));\n        Ok(rows.len())'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # Gateway: ToolAuthorized evidence is part of authorization commit. In ENFORCE,
          # if we cannot durably record it, never call upstream.
          p=Path('crates/heraclitus-agent-gateway/src/gateway.rs')
          s=p.read_text()
          old='''                        autorizada.content.approval = Some(ApprovalProvenanceV1 {\n                            approval_id,\n                            authorization_subject_hash: subject_hash,\n                            approver_subject: None,\n                            approver_issuer: None,\n                            decided_at_unix_nanos: None,\n                        });\n                        let _ = append(runtime, autorizada);'''
          new='''                        autorizada.content.approval = Some(ApprovalProvenanceV1 {\n                            approval_id,\n                            authorization_subject_hash: subject_hash,\n                            approver_subject: None,\n                            approver_issuer: None,\n                            decided_at_unix_nanos: None,\n                        });\n                        let authorization_write = append(runtime, autorizada);\n                        if let Gravacao::Falhou(motivo) = authorization_write {\n                            if enforced {\n                                let _ = runtime.flush();\n                                return mcp_error(\n                                    StatusCode::INTERNAL_SERVER_ERROR,\n                                    &facts.tool_call_id,\n                                    "AUTHORIZATION_EVIDENCE_NOT_RECORDED",\n                                    &motivo,\n                                );\n                            }\n                        }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          spec=Path('docs/md/SPEC-new/SPEC-0082-Durable-Approval-Replay-Across-Restart.md')
          spec.write_text('''# SPEC-0082 — Durable Approval Replay Across Restart\n\n**Status:** IMPLEMENTED / QUALIFICATION REQUIRED\n\n## Achado reproduzido em sandbox\nUma ação `send_payment` foi aprovada, executada uma vez e corretamente recusada como `APPROVAL_REPLAYED` antes do restart. Depois de reiniciar o mesmo binário com o mesmo diretório HRKL, o mesmo request lógico voltou a `202 APPROVAL_PENDING`, porque `AgentRuntime::warm()` reconstruía dedupe mas aquecia `ApprovalStore` com lista vazia. Uma nova aprovação humana poderia portanto autorizar novamente a mesma operação lógica.\n\n## Invariantes\n- `ToolAuthorized` persistido é o commit durável de que o approval foi consumido.\n- No arranque, o Gateway reconstrói um ledger `(authorization_subject_hash -> approval_id)` a partir de `ToolAuthorized`.\n- O mesmo subject após restart retorna `APPROVAL_REPLAYED`, sem novo approval e sem upstream.\n- Uma operação logicamente nova continua possível porque `request_id` faz parte do subject hash.\n- Em `ENFORCE`, se `ToolAuthorized` não puder ser gravado, a chamada externa não acontece. É preferível consumir uma aprovação sem efeito externo e exigir recuperação manual a executar sem commit durável de autorização.\n\n## Limite deliberado\nAprovação concedida mas ainda não consumida não é automaticamente restaurada como grant após crash. Ela deve voltar a exigir decisão humana. Isso é fail-closed.\n\n## Gates\n- unit: subject consumido reconstruído continua `AlreadyUsed`;\n- gateway E2E completo;\n- clippy deny warnings;\n- live sandbox: approve -> execute once -> restart -> exact retry = 403 `APPROVAL_REPLAYED`, upstream delta 0.\n''')
          PY
          cargo fmt --all
      - name: Qualify
        run: |
          cargo test -p heraclitus-agent --lib action::tests -- --nocapture
          cargo test -p heraclitus-agent-gateway --all-features
          cargo clippy -p heraclitus-agent -p heraclitus-agent-gateway --all-targets --all-features -- -D warnings
      - name: Commit qualified fix and remove workflow
        shell: bash
        run: |
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/spec-0082-durable-approval-replay.yml
          git add -A
          git commit -m 'fix(spec-0082): persist approval replay protection across restart'
          git push origin HEAD:gpt56/agent-security-observability
