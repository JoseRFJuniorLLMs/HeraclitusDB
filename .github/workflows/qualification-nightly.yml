name: Qualification preflight nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  crash-corruption-raft:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Qualifier policy and evidence invariants
        run: cargo test --locked -p heraclitus-qualifier
      - name: Legacy crash loop — 1000 abrupt kills
        run: cargo test --locked -p heraclitus-log --test crash_injection -- --nocapture
        env:
          CRASH_ITERS: "1000"
      - name: HRKL v6 crash boundaries
        run: >-
          cargo test --locked -p heraclitus-log
          --test hrkl_v6_crash
          --test hrkl_v6_packer_crash
          --test hrkl_v6_gc_crash
          -- --nocapture
      - name: Corruption and migration preflight
        run: >-
          cargo test --locked -p heraclitus-log
          --test compat_matrix_v1_v5
          --test hrkl_v6_migrate_database
          -- --nocapture
      - name: Raft process-level matrix
        run: cargo test --locked -p heraclitus-raft --all-features -- --nocapture

  release-binary-crash-loop:
    # §22 wants the *shipped process* killed, not a writer inside a test
    # harness. This job is the only place that happens on every nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build the release binaries under qualification
        run: cargo build --release --locked -p heraclitus-server -p heraclitus-qualifier
      - name: Abrupt kill, reopen and re-read every acknowledgement
        run: >-
          ./target/release/heraclitus-qualifier crash-loop
          --server-binary ./target/release/heraclitus-server
          --root "$RUNNER_TEMP/crash-run"
          --cycles 40 --concurrency 8 --durability always --seed 428931
          --report "$RUNNER_TEMP/crash-report.json"
      - name: Configuration qualification of the reference config
        run: >-
          ./target/release/heraclitus-qualifier doctor
          --config qa/qualification/configs/reference-loopback.toml
      - name: Short soak with the §20 leak gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/soak/data"
          cat > "$RUNNER_TEMP/soak/heraclitus.toml" <<EOF
          data_dir = "$RUNNER_TEMP/soak/data"
          grpc_addr = "127.0.0.1:7474"
          rest_addr = "127.0.0.1:7475"
          segment_max_bytes = 8388608
          [fsync]
          mode = "always"
          EOF
          ./target/release/heraclitus-server "$RUNNER_TEMP/soak/heraclitus.toml" &
          server_pid=$!
          # A soak whose subject died is inconclusive, not a pass; fail loudly.
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then echo "server exited during warm-up"; exit 1; fi
            sleep 1
          done
          jq -n '{schema_version:1,id:"soak-nightly",description:"Nightly smoke soak; far too short to satisfy the long_soak gate.",
                  duration_seconds:900,sample_interval_seconds:15,stabilization_seconds:180,concurrency:8,
                  workload_profile:"mixed",memory_growth_budget_bytes_per_hour:134217728,
                  handle_growth_budget_per_hour:60,thread_growth_budget_per_hour:4,
                  latency_drift_budget_ratio:3.0,satisfies_level:"development"}' \
            > "$RUNNER_TEMP/soak/profile.json"
          ./target/release/heraclitus-qualifier soak \
            --target http://127.0.0.1:7474 --pid "$server_pid" \
            --profile "$RUNNER_TEMP/soak/profile.json" \
            --report "$RUNNER_TEMP/soak/report.json" || soak_status=$?
          kill -9 "$server_pid" 2>/dev/null || true
          # Inconclusive (exit 1 with no failures recorded) is tolerated here:
          # a 15-minute run cannot clear a leak gate, and pretending otherwise
          # is exactly what §18 warns against. A recorded failure is not.
          if [ -f "$RUNNER_TEMP/soak/report.json" ]; then
            jq -e '.failures | length == 0' "$RUNNER_TEMP/soak/report.json" > /dev/null
          else
            exit "${soak_status:-1}"
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: nightly-qualification-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/crash-report.json
            ${{ runner.temp }}/soak/report.json

  # O budget de fuzzing longo que estava no CI por PR. La pedia 50 minutos
  # dentro de um timeout de 35 e nunca podia terminar; aqui tem tempo a serio,
  # corre uma vez por noite e preserva o corpus de crash como artefacto.
  # O CI por PR ficou com um passe de fumo de 60s por target.
  fuzz-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly action
        with:
          toolchain: nightly-2026-02-17
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz log decode (10 min budget)
        run: cargo +nightly-2026-02-17 fuzz run log_decode -- -max_total_time=600
      - name: fuzz query parser (10 min budget, M4 gate)
        run: cargo +nightly-2026-02-17 fuzz run query_parser -- -max_total_time=600
      - name: fuzz manifold operations (10 min budget)
        run: cargo +nightly-2026-02-17 fuzz run manifold_ops -- -max_total_time=600
      - name: fuzz HRKL v6 decoders (10 min budget)
        run: cargo +nightly-2026-02-17 fuzz run v6_decode -- -max_total_time=600
      - name: fuzz configuration parser (5 min budget, SPEC-0049)
        run: cargo +nightly-2026-02-17 fuzz run config_parse -- -max_total_time=300
      - name: fuzz RFC 3161 timestamp material (5 min budget, SPEC-0049)
        run: cargo +nightly-2026-02-17 fuzz run rfc3161_decode -- -max_total_time=300
      - name: preserve any crash as regression corpus (SPEC-0049)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-deep-crash-artifacts
          if-no-files-found: ignore
          path: fuzz/artifacts/

  # SPEC-0072 §37 — Gate Linux L7: qualificação de escala.
  #
  # Os L0-L6 correm por PR (ci.yml, job `linux-gates`) porque são gates de
  # CORRECÇÃO. Este é de ESCALA: enche uma base, encadeia os cinco cenários de
  # restart da §37 sobre o mesmo directório persistente e mede wall_time,
  # cpu_time, peak RSS, io_bytes e events_scanned em cada arranque.
  #
  # O dataset do nightly é menor do que os 20M que a §37 pede para a
  # qualificação formal — 20M por gRPC unário são horas num runner. As relações
  # que o gate verifica (warm boot lê a CAUDA e não a base) são as mesmas nas
  # duas escalas, e o script imprime qual correu. Para a corrida formal, num
  # host a sério: HERACLITUS_L7_EVENTOS=20000000.
  linux-gate-l7:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: L7 — escala e cenários de restart encadeados
        env:
          # O runner monta o workspace em disco persistente; `mktemp -d` cairia
          # em /tmp, que em alguns runners é tmpfs — e o script recusa correr em
          # RAM, com razão: medir replay em RAM não mede replay.
          HERACLITUS_L7_DIR: ${{ github.workspace }}/l7-dados
          HERACLITUS_L7_EVENTOS: "60000"
        run: |
          mkdir -p "$HERACLITUS_L7_DIR"
          bash scripts/linux-gate-l7.sh
