name: Qualification preflight nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  crash-corruption-raft:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Qualifier policy and evidence invariants
        run: cargo test --locked -p heraclitus-qualifier
      - name: Legacy crash loop — 1000 abrupt kills
        run: cargo test --locked -p heraclitus-log --test crash_injection -- --nocapture
        env:
          CRASH_ITERS: "1000"
      - name: HRKL v6 crash boundaries
        run: >-
          cargo test --locked -p heraclitus-log
          --test hrkl_v6_crash
          --test hrkl_v6_packer_crash
          --test hrkl_v6_gc_crash
          -- --nocapture
      - name: Corruption and migration preflight
        run: >-
          cargo test --locked -p heraclitus-log
          --test compat_matrix_v1_v5
          --test hrkl_v6_migrate_database
          -- --nocapture
      - name: Raft process-level matrix
        run: cargo test --locked -p heraclitus-raft --all-features -- --nocapture

  release-binary-crash-loop:
    # §22 wants the *shipped process* killed, not a writer inside a test
    # harness. This job is the only place that happens on every nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build the release binaries under qualification
        run: cargo build --release --locked -p heraclitus-server -p heraclitus-qualifier
      - name: Abrupt kill, reopen and re-read every acknowledgement
        run: >-
          ./target/release/heraclitus-qualifier crash-loop
          --server-binary ./target/release/heraclitus-server
          --root "$RUNNER_TEMP/crash-run"
          --cycles 40 --concurrency 8 --durability always --seed 428931
          --report "$RUNNER_TEMP/crash-report.json"
      - name: Configuration qualification of the reference config
        run: >-
          ./target/release/heraclitus-qualifier doctor
          --config qa/qualification/configs/reference-loopback.toml
      - name: Short soak with the §20 leak gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/soak/data"
          cat > "$RUNNER_TEMP/soak/heraclitus.toml" <<EOF
          data_dir = "$RUNNER_TEMP/soak/data"
          grpc_addr = "127.0.0.1:7474"
          rest_addr = "127.0.0.1:7475"
          segment_max_bytes = 8388608
          [fsync]
          mode = "always"
          EOF
          ./target/release/heraclitus-server "$RUNNER_TEMP/soak/heraclitus.toml" &
          server_pid=$!
          # A soak whose subject died is inconclusive, not a pass; fail loudly.
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then echo "server exited during warm-up"; exit 1; fi
            sleep 1
          done
          jq -n '{schema_version:1,id:"soak-nightly",description:"Nightly smoke soak; far too short to satisfy the long_soak gate.",
                  duration_seconds:900,sample_interval_seconds:15,stabilization_seconds:180,concurrency:8,
                  workload_profile:"mixed",memory_growth_budget_bytes_per_hour:134217728,
                  handle_growth_budget_per_hour:60,thread_growth_budget_per_hour:4,
                  latency_drift_budget_ratio:3.0,satisfies_level:"development"}' \
            > "$RUNNER_TEMP/soak/profile.json"
          ./target/release/heraclitus-qualifier soak \
            --target http://127.0.0.1:7474 --pid "$server_pid" \
            --profile "$RUNNER_TEMP/soak/profile.json" \
            --report "$RUNNER_TEMP/soak/report.json" || soak_status=$?
          kill -9 "$server_pid" 2>/dev/null || true
          # Inconclusive (exit 1 with no failures recorded) is tolerated here:
          # a 15-minute run cannot clear a leak gate, and pretending otherwise
          # is exactly what §18 warns against. A recorded failure is not.
          if [ -f "$RUNNER_TEMP/soak/report.json" ]; then
            jq -e '.failures | length == 0' "$RUNNER_TEMP/soak/report.json" > /dev/null
          else
            exit "${soak_status:-1}"
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: nightly-qualification-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/crash-report.json
            ${{ runner.temp }}/soak/report.json
