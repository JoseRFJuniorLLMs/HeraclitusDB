name: Release 3 lock sync

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - Cargo.toml
      - .github/workflows/release-3-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0

      - name: Rust 1.96.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0

      - name: Regenerate Cargo.lock for workspace version
        run: cargo update --workspace

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(release): synchronize Cargo.lock for 3.0.0"
          git push origin HEAD:gpt56/agent-security-observability
