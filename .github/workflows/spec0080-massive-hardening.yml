name: SPEC-0080 massive hardening

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/workflows/spec0080-massive-hardening.yml
      - scripts/spec0080_massive_hardening.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply hardening
        run: python3 scripts/spec0080_massive_hardening.py
      - name: Format and focused tests
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --locked -p heraclitus-agent-gateway
          cargo clippy --locked -p heraclitus-agent-gateway --all-targets -- -D warnings
      - name: Commit product hardening and remove one-shot files
        shell: bash
        run: |
          set -euxo pipefail
          rm -f scripts/spec0080_massive_hardening.py .github/workflows/spec0080-massive-hardening.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/heraclitus-agent-gateway/src/gateway.rs scripts/spec0080_massive_hardening.py .github/workflows/spec0080-massive-hardening.yml
          git commit -m 'fix(agent-gateway): fail closed on confusable tools/call methods'
          git push origin HEAD:gpt56/agent-security-observability
