name: SPEC-0081 approval pending idempotency
on:
  push:
    branches: [gpt56/agent-security-observability]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply pending retry fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/heraclitus-agent-gateway/src/gateway.rs')
          s=p.read_text()
          needle='''                    ApprovalVerdict::NotFound if enforced || mode == GatewayMode::Shadow => {'''
          insert='''                    ApprovalVerdict::Pending { approval_id } => {\n                        // Retry idempotente de uma operação que continua à espera\n                        // de decisão humana. Não é uma recusa: devolver o MESMO\n                        // 202 permite ao agente aguardar/pollar sem criar outra\n                        // aprovação e sem transformar "pending" em falso 403.\n                        if enforced {\n                            let Some(record) = runtime.approvals.get(&approval_id) else {\n                                return mcp_error(\n                                    StatusCode::INTERNAL_SERVER_ERROR,\n                                    &facts.tool_call_id,\n                                    "APPROVAL_STATE_LOST",\n                                    "pending approval disappeared from the live index",\n                                );\n                            };\n                            let _ = runtime.flush();\n                            return approval_pending(&facts.tool_call_id, &record.request);\n                        }\n                    }\n                    ApprovalVerdict::NotFound if enforced || mode == GatewayMode::Shadow => {'''
          assert needle in s
          s=s.replace(needle,insert,1)
          p.write_text(s)

          spec=Path('docs/md/SPEC-new/SPEC-0081-Approval-Pending-Idempotency.md')
          spec.write_text('''# SPEC-0081 — Approval Pending Idempotency\n\n**Status:** IMPLEMENTED / QUALIFIED\n\n## Achado\nEm campanha massiva repetida, o mesmo request lógico ainda pendente era corretamente reconhecido pelo `ApprovalStore`, porém o Gateway caía no ramo genérico e respondia HTTP 403 `APPROVAL_PENDING`. Isso preservava segurança, mas quebrava idempotência e confundia espera legítima com recusa.\n\n## Contrato\n- primeiro pedido que exige aprovação: `202 APPROVAL_PENDING`;\n- retry exato enquanto continua pendente: o mesmo `202`, mesmo `approval_id`, zero efeito upstream e nenhuma segunda aprovação;\n- após grant: exatamente uma execução;\n- após consumo: replay continua 403;\n- argumentos/agent/request diferentes continuam sujeitos ao binding normal.\n\nA correção é fail-closed se o índice disser `Pending` mas o registro desaparecer antes de construir a resposta.\n''')
          PY
          cargo fmt --all
      - name: Qualify
        run: |
          cargo test -p heraclitus-agent --lib action::tests -- --nocapture
          cargo test -p heraclitus-agent-gateway --all-features
          cargo clippy -p heraclitus-agent-gateway --all-targets --all-features -- -D warnings
      - name: Commit qualified fix and remove workflow
        shell: bash
        run: |
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/spec-0081-approval-pending-idempotency.yml
          git add -A
          git commit -m 'fix(spec-0081): keep pending approval retries idempotent'
          git push origin HEAD:gpt56/agent-security-observability
