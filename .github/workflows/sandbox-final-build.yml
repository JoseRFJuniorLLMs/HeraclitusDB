name: Sandbox corrected binary
on:
  push:
    branches: [gpt56/agent-security-observability]
    paths: [.github/workflows/sandbox-final-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Build release server
        run: |
          set -euxo pipefail
          git rev-parse HEAD | tee COMMIT
          cargo build --release -p heraclitus-server
          cp target/release/heraclitus-server ./heraclitus-server
          sha256sum heraclitus-server > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: heraclitus-sandbox-final
          path: |
            heraclitus-server
            COMMIT
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
