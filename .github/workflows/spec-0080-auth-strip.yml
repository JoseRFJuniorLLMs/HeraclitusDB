name: SPEC-0080 gateway credential stripping

on:
  push:
    branches: [gpt56/agent-security-observability]
    paths: [.github/spec0080-auth-strip-trigger]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Strip caller authorization at upstream boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/heraclitus-agent-gateway/src/gateway.rs')
          s=p.read_text()
          old='''    let mut upstream_header_map = header_map.clone();\n    if principal.is_some() {\n        upstream_header_map.remove("authorization");\n    }'''
          new='''    let mut upstream_header_map = header_map.clone();\n    // Authorization authenticates the caller to this gateway. There is no\n    // configured upstream credential source yet, so forwarding a caller token\n    // would be credential leakage in both OIDC and dev_local modes.\n    upstream_header_map.remove("authorization");'''
          if old not in s: raise SystemExit('authorization strip anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
      - name: Tests and lint
        run: |
          set -euxo pipefail
          cargo test --locked -p heraclitus-agent-gateway --all-targets
          cargo clippy --locked -p heraclitus-agent-gateway --all-targets -- -D warnings
      - name: Commit qualified fix and self-clean
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/spec0080-auth-strip-trigger .github/workflows/spec-0080-auth-strip.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(spec-0080): never forward caller authorization upstream'
          git push origin HEAD:gpt56/agent-security-observability
