name: SPEC-0080 approval request binding

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/workflows/spec-0080-approval-request-binding.yml

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply deterministic patch
        run: python3 scripts/spec0080_apply.py
      - name: Format
        run: cargo fmt --all
      - name: Agent approval tests
        run: cargo test -p heraclitus-agent action::tests -- --nocapture
      - name: Gateway tests
        run: cargo test -p heraclitus-agent-gateway
      - name: Clippy
        run: cargo clippy -p heraclitus-agent -p heraclitus-agent-gateway --all-targets -- -D warnings
      - name: Lab guards
        run: |
          python3 -m py_compile labs/Agent-Atack-Heraclitus/runner.py labs/Agent-Atack-Heraclitus/runner_massive.py
          python3 -m unittest labs/Agent-Atack-Heraclitus/tests/test_guard.py
      - name: Commit qualified fix and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/spec-0080-approval-request-binding.yml scripts/spec0080_apply.py
          git add crates/heraclitus-agent/src/action.rs crates/heraclitus-agent/src/demo.rs \
                  crates/heraclitus-agent-gateway/src/gateway.rs \
                  labs/Agent-Atack-Heraclitus/runner.py labs/Agent-Atack-Heraclitus/runner_massive.py \
                  docs/md/SPEC-new/SPEC-0080-Per-Request-Approval-Binding.md
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(spec-0080): bind approvals to logical request identity'
          git push origin HEAD:gpt56/agent-security-observability
