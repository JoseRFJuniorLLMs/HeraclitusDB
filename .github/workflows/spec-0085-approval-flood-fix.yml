name: SPEC-0085 approval flood containment

on:
  push:
    branches: [gpt56/agent-security-observability]

permissions:
  contents: write

jobs:
  implement-and-qualify:
    if: ${{ !contains(github.event.head_commit.message, 'fix(spec-0085)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Apply SPEC-0085 implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old,new,1)

          # 1. Explicit finite defaults and validation.
          p='crates/heraclitus-agent/src/config.rs'
          s=read(p)
          old='''pub struct ApprovalConfig {\n    pub default_ttl_seconds: u64,\n}\n\nimpl Default for ApprovalConfig {\n    fn default() -> Self {\n        Self {\n            default_ttl_seconds: 300,\n        }\n    }\n}\n'''
          new='''pub struct ApprovalConfig {\n    pub default_ttl_seconds: u64,\n    /// SPEC-0085: hard ceiling for live pending approval requests.\n    pub max_pending_global: usize,\n    /// SPEC-0085: one compromised agent cannot consume the shared queue.\n    pub max_pending_per_agent: usize,\n}\n\nimpl Default for ApprovalConfig {\n    fn default() -> Self {\n        Self {\n            default_ttl_seconds: 300,\n            max_pending_global: 4096,\n            max_pending_per_agent: 64,\n        }\n    }\n}\n'''
          s=rep(s,old,new,'ApprovalConfig')
          anchor='''        if self.upstream_url.is_empty() {\n            return Err(ConfigError::Invalid(\n                "o gateway precisa de `upstream_url` em qualquer modo: sem ele o \\\n                 proxy aceita ligações e responde 502 a tudo"\n                    .into(),\n            ));\n        }\n'''
          add=anchor+'''        if self.approval.max_pending_global == 0 {\n            return Err(ConfigError::Invalid(\n                "agent_gateway.approval.max_pending_global deve ser > 0 (SPEC-0085)".into(),\n            ));\n        }\n        if self.approval.max_pending_per_agent == 0 {\n            return Err(ConfigError::Invalid(\n                "agent_gateway.approval.max_pending_per_agent deve ser > 0 (SPEC-0085)".into(),\n            ));\n        }\n        if self.approval.max_pending_per_agent > self.approval.max_pending_global {\n            return Err(ConfigError::Invalid(\n                "agent_gateway.approval.max_pending_per_agent não pode exceder max_pending_global (SPEC-0085)".into(),\n            ));\n        }\n'''
          s=rep(s,anchor,add,'approval config validation')
          write(p,s)

          # 2. Atomic admission control inside ApprovalStore.
          p='crates/heraclitus-agent/src/action.rs'
          s=read(p)
          anchor='''pub struct ApprovalStore {\n    inner: Mutex<BTreeMap<String, ApprovalRecord>>,\n    /// Assuntos já consumidos reconstruídos do HRKL. Separado dos records\n    /// vivos porque uma execução antiga não precisa de preview/TTL para ser\n    /// reconhecida como replay, apenas do subject hash e approval id.\n    consumed_subjects: Mutex<BTreeMap<String, String>>,\n}\n'''
          add=anchor+'''\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum ApprovalAdmissionError {\n    GlobalLimit { limit: usize },\n    PerAgentLimit { agent: String, limit: usize },\n}\n\nimpl std::fmt::Display for ApprovalAdmissionError {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        match self {\n            Self::GlobalLimit { limit } => write!(f, "global pending approval limit reached ({limit})"),\n            Self::PerAgentLimit { agent, limit } => {\n                write!(f, "pending approval limit reached for agent `{agent}` ({limit})")\n            }\n        }\n    }\n}\n'''
          s=rep(s,anchor,add,'ApprovalAdmissionError')
          pat=re.compile(r'''    pub fn request\(&self, req: ApprovalRequestV1, now: u64\) -> ApprovalRequestV1 \{.*?\n    \}\n\n    /// Aplica uma decisão humana\.''',re.S)
          m=pat.search(s)
          if not m: raise SystemExit('missing request() block')
          repl='''    pub fn request(&self, req: ApprovalRequestV1, now: u64) -> ApprovalRequestV1 {\n        self.request_bounded(req, now, usize::MAX, usize::MAX)\n            .expect("unbounded approval admission cannot hit a capacity limit")\n    }\n\n    /// SPEC-0085: duplicate detection and capacity admission are one critical\n    /// section, so a concurrent swarm cannot race past either ceiling. Exact\n    /// retries are checked first and therefore consume no extra capacity.\n    pub fn request_bounded(\n        &self,\n        req: ApprovalRequestV1,\n        now: u64,\n        max_pending_global: usize,\n        max_pending_per_agent: usize,\n    ) -> Result<ApprovalRequestV1, ApprovalAdmissionError> {\n        let mut map = self.inner.lock().unwrap();\n        expire_locked(&mut map, now);\n        if let Some(existing) = map.values().find(|r| {\n            r.state == ApprovalState::Pending\n                && r.request.authorization_subject_hash == req.authorization_subject_hash\n        }) {\n            return Ok(existing.request.clone());\n        }\n\n        let pending_global = map\n            .values()\n            .filter(|r| r.state == ApprovalState::Pending)\n            .count();\n        if pending_global >= max_pending_global {\n            return Err(ApprovalAdmissionError::GlobalLimit {\n                limit: max_pending_global,\n            });\n        }\n\n        let agent = req.preview.agent.clone();\n        let pending_agent = map\n            .values()\n            .filter(|r| {\n                r.state == ApprovalState::Pending && r.request.preview.agent == agent\n            })\n            .count();\n        if pending_agent >= max_pending_per_agent {\n            return Err(ApprovalAdmissionError::PerAgentLimit {\n                agent,\n                limit: max_pending_per_agent,\n            });\n        }\n\n        let out = req.clone();\n        map.insert(\n            req.approval_id.clone(),\n            ApprovalRecord {\n                request: req,\n                decision: None,\n                state: ApprovalState::Pending,\n                authorization: None,\n            },\n        );\n        Ok(out)\n    }\n\n    /// Aplica uma decisão humana.'''
          s=s[:m.start()]+repl+s[m.end():]
          tests='''\n\n#[cfg(test)]\nmod spec_0085_capacity_tests {\n    use super::*;\n\n    fn request(agent: &str, id: &str, subject: &str) -> ApprovalRequestV1 {\n        ApprovalRequestV1 {\n            approval_id: id.into(),\n            request_id: id.into(),\n            authorization_subject_hash: subject.into(),\n            requested_roles: vec!["approver".into()],\n            reason: "test".into(),\n            preview: ApprovalPreviewV1 { agent: agent.into(), ..Default::default() },\n            requested_at: 1,\n            expires_at: 999,\n        }\n    }\n\n    #[test]\n    fn per_agent_limit_is_atomic_and_retry_costs_nothing() {\n        let store = ApprovalStore::new();\n        let a = request("agent-a", "a1", "subject-a1");\n        let b = request("agent-a", "a2", "subject-a2");\n        assert!(store.request_bounded(a.clone(), 10, 4, 2).is_ok());\n        assert!(store.request_bounded(b, 10, 4, 2).is_ok());\n        assert!(matches!(\n            store.request_bounded(request("agent-a", "a3", "subject-a3"), 10, 4, 2),\n            Err(ApprovalAdmissionError::PerAgentLimit { limit: 2, .. })\n        ));\n        let retry = store.request_bounded(a, 10, 4, 2).unwrap();\n        assert_eq!(retry.approval_id, "a1");\n        assert_eq!(store.pending(10).len(), 2);\n    }\n\n    #[test]\n    fn global_limit_contains_multi_agent_fanout() {\n        let store = ApprovalStore::new();\n        for i in 0..4 {\n            assert!(store\n                .request_bounded(\n                    request(&format!("agent-{i}"), &format!("id-{i}"), &format!("s-{i}")),\n                    10,\n                    4,\n                    4,\n                )\n                .is_ok());\n        }\n        assert!(matches!(\n            store.request_bounded(request("agent-z", "id-z", "s-z"), 10, 4, 4),\n            Err(ApprovalAdmissionError::GlobalLimit { limit: 4 })\n        ));\n        assert_eq!(store.pending(10).len(), 4);\n    }\n}\n'''
          if 'mod spec_0085_capacity_tests' not in s: s += tests
          write(p,s)

          # 3. Observable counter.
          p='crates/heraclitus-agent-gateway/src/runtime.rs'
          s=read(p)
          s=rep(s,'    pub approval_replay_rejected: AtomicU64,\n','    pub approval_replay_rejected: AtomicU64,\n    pub approval_capacity_rejected: AtomicU64,\n','counter field')
          s=rep(s,'            "approval_replay_rejected": self.approval_replay_rejected.load(Ordering::Relaxed),\n','            "approval_replay_rejected": self.approval_replay_rejected.load(Ordering::Relaxed),\n            "approval_capacity_rejected": self.approval_capacity_rejected.load(Ordering::Relaxed),\n','counter snapshot')
          write(p,s)

          # 4. Gateway returns 429 fail-closed and emits native denial evidence.
          p='crates/heraclitus-agent-gateway/src/gateway.rs'
          s=read(p)
          old='''                        let pedido = runtime.approvals.request(pedido, now);\n\n                        let mut pedida = base_evidence(\n                            runtime,\n                            AgentEvidenceKindV1::HumanApprovalRequested,\n                            now_unix_nanos(),\n                            &exchange,\n                            &facts,\n                            &agent_id,\n                        );\n                        pedida.content.policy = provenance.clone();\n                        pedida.content.approval = Some(ApprovalProvenanceV1 {\n                            approval_id: pedido.approval_id.clone(),\n                            authorization_subject_hash: subject_hash.clone(),\n                            approver_subject: None,\n                            approver_issuer: None,\n                            decided_at_unix_nanos: None,\n                        });\n                        pedida.parents = requested_id.iter().cloned().collect();\n                        let _ = append(runtime, pedida);\n                        let _ = runtime.flush();\n\n                        if enforced {\n                            return approval_pending(&facts.tool_call_id, &pedido);\n                        }\n'''
          new='''                        let pedido = runtime.approvals.request_bounded(\n                            pedido,\n                            now,\n                            runtime.gateway.approval.max_pending_global,\n                            runtime.gateway.approval.max_pending_per_agent,\n                        );\n\n                        match pedido {\n                            Ok(pedido) => {\n                                let mut pedida = base_evidence(\n                                    runtime,\n                                    AgentEvidenceKindV1::HumanApprovalRequested,\n                                    now_unix_nanos(),\n                                    &exchange,\n                                    &facts,\n                                    &agent_id,\n                                );\n                                pedida.content.policy = provenance.clone();\n                                pedida.content.approval = Some(ApprovalProvenanceV1 {\n                                    approval_id: pedido.approval_id.clone(),\n                                    authorization_subject_hash: subject_hash.clone(),\n                                    approver_subject: None,\n                                    approver_issuer: None,\n                                    decided_at_unix_nanos: None,\n                                });\n                                pedida.parents = requested_id.iter().cloned().collect();\n                                let _ = append(runtime, pedida);\n                                let _ = runtime.flush();\n\n                                if enforced {\n                                    return approval_pending(&facts.tool_call_id, &pedido);\n                                }\n                            }\n                            Err(limit) => {\n                                GatewayCounters::bump(\n                                    &runtime.gateway_counters.approval_capacity_rejected,\n                                );\n                                let mut denied = base_evidence(\n                                    runtime,\n                                    AgentEvidenceKindV1::ToolDenied,\n                                    now_unix_nanos(),\n                                    &exchange,\n                                    &facts,\n                                    &agent_id,\n                                );\n                                denied.content.policy = provenance.clone();\n                                denied.content.extensions.insert(\n                                    "reason_code".into(),\n                                    "APPROVAL_QUEUE_FULL".into(),\n                                );\n                                denied.content.extensions.insert(\n                                    "approval_admission".into(),\n                                    limit.to_string(),\n                                );\n                                denied.parents = requested_id.iter().cloned().collect();\n                                let _ = append(runtime, denied);\n                                let _ = runtime.flush();\n\n                                if enforced {\n                                    return mcp_error(\n                                        StatusCode::TOO_MANY_REQUESTS,\n                                        &facts.tool_call_id,\n                                        "APPROVAL_QUEUE_FULL",\n                                        &limit.to_string(),\n                                    );\n                                }\n                                tracing::warn!(\n                                    motivo = %limit,\n                                    "shadow approval simulation capacity exhausted; action remains non-blocking"\n                                );\n                            }\n                        }\n'''
          s=rep(s,old,new,'gateway bounded approval admission')
          write(p,s)

          # 5. Mark SPEC implemented only after code exists in the same commit.
          p='docs/md/SPEC-new/SPEC-0085-Approval-Flood-Containment.md'
          s=read(p).replace('**Status:** PROPOSED','**Status:** IMPLEMENTED',1)
          write(p,s)

      - name: Format and focused qualification
        run: |
          cargo fmt --all -- --check
          cargo test -p heraclitus-agent spec_0085_capacity_tests -- --nocapture
          cargo test -p heraclitus-agent-gateway --all-targets
          cargo clippy -p heraclitus-agent -p heraclitus-agent-gateway --all-targets -- -D warnings

      - name: Commit qualified implementation and remove one-shot workflow
        run: |
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/spec-0085-approval-flood-fix.yml
          git add crates/heraclitus-agent/src/config.rs \
                  crates/heraclitus-agent/src/action.rs \
                  crates/heraclitus-agent-gateway/src/runtime.rs \
                  crates/heraclitus-agent-gateway/src/gateway.rs \
                  docs/md/SPEC-new/SPEC-0085-Approval-Flood-Containment.md
          git commit -m 'fix(spec-0085): bound approval flood state atomically'
          git push origin HEAD:gpt56/agent-security-observability
