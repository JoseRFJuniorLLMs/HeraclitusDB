name: SPEC-0078 red-team P0/P1 closure

on:
  push:
    branches:
      - gpt56/spec-0078-redteam-p0
    paths:
      - .github/spec-0078-redteam-trigger

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/spec-0078-redteam-p0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Apply SPEC-0078 sandbox red-team fixes
        run: |
          python3 scripts/spec0078_redteam_fix.py
          python3 scripts/spec0078_redteam_followup.py

      - name: Remove vulnerable ratatui/lru graph when still present
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          t = p.read_text()
          if 'ratatui = "0.29"' in t:
              p.write_text(t.replace('ratatui = "0.29"', 'ratatui = "0.30.2"', 1))
          PY
          cargo update -p ratatui --precise 0.30.2
          if cargo tree -i lru@0.12.5 >/tmp/lru-tree.txt 2>&1; then
            cat /tmp/lru-tree.txt
            echo 'vulnerable lru 0.12.5 remains in dependency graph' >&2
            exit 1
          else
            cat /tmp/lru-tree.txt || true
            echo 'vulnerable lru 0.12.5 removed; newer lru versions are allowed'
          fi

      - name: Format
        run: cargo fmt --all

      - name: Agent core regressions
        run: cargo test -p heraclitus-agent

      - name: Gateway E2E and OTLP regressions
        run: |
          cargo test -p heraclitus-agent-gateway --test gateway_end_to_end
          cargo test -p heraclitus-agent-gateway --test quickstart_otlp
          cargo test -p heraclitus-agent-gateway --test mcp_privacy

      - name: Qualifier truth regressions
        run: cargo test -p heraclitus-cli

      - name: Clippy touched security crates
        run: |
          cargo clippy -p heraclitus-agent --all-targets -- -D warnings
          cargo clippy -p heraclitus-agent-gateway --all-targets -- -D warnings
          cargo clippy -p heraclitus-cli --all-targets -- -D warnings

      - name: RustSec gate
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071

      - name: Commit qualified fixes
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/spec-0078-redteam-trigger
          rm -f .github/workflows/spec-0078-redteam-p0.yml
          rm -f scripts/spec0078_redteam_fix.py
          rm -f scripts/spec0078_redteam_followup.py
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec-0078): close hostile-agent gateway bypasses'
          git push origin HEAD:gpt56/spec-0078-redteam-p0
