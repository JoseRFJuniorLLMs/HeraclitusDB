name: Dispatch v3.0.0 supply chain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v3-supply-chain.yml

permissions:
  actions: write
  contents: read

# One-shot dispatcher: removed after the official v3.0.0 supply-chain run starts.
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch official release supply-chain at v3.0.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-supply-chain.yml \
            --repo JoseRFJuniorLLMs/HeraclitusDB \
            --ref v3.0.0 \
            -f release_version=3.0.0
