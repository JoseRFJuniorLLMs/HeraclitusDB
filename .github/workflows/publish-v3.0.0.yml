name: Publish HeraclitusDB v3.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'JoseRFJuniorLLMs/HeraclitusDB'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merged main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Cargo.toml').read_text(encoding='utf-8')
          m = re.search(r'\[workspace\.package\].*?\nversion\s*=\s*"([^"]+)"', text, re.S)
          if not m:
              raise SystemExit('workspace.package version not found')
          print(m.group(1))
          PY
          )"
          test "$actual" = "3.0.0"
          test -f docs/md/RELEASE_NOTES_v3.0.0.md

      - name: Create signed-point release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v3.0.0 >/dev/null 2>&1; then
            echo "v3.0.0 already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v3.0.0 "$GITHUB_SHA" -m "HeraclitusDB v3.0.0"
            git push origin refs/tags/v3.0.0
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.0.0 >/dev/null 2>&1; then
            echo "GitHub release v3.0.0 already exists"
          else
            gh release create v3.0.0 \
              --verify-tag \
              --title "HeraclitusDB v3.0.0" \
              --notes-file docs/md/RELEASE_NOTES_v3.0.0.md
          fi
