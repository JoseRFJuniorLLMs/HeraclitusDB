name: SPEC-0084 Agent ENFORCE Core auth barrier

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/workflows/spec-0084-core-auth-barrier.yml

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply auth-boundary fixes
        run: python3 scripts/spec0084_apply.py
      - name: Align legacy public-OTLP test with listener-specific auth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/heraclitus-agent/src/config.rs')
          s = p.read_text()
          old = '''        c.otlp.http_addr = "0.0.0.0:4318".into();
                  assert!(c.validate(true, false, false).is_err());
                  assert!(c.validate(true, true, true).is_ok());
                  assert!(c.validate(false, false, false).is_ok(), "dev não é gateado");'''
          new = '''        c.otlp.http_addr = "0.0.0.0:4318".into();
                  assert!(c.validate(true, false, false).is_err());
                  c.console.basic_auth = "collector:a-strong-local-password".into();
                  c.otlp.require_auth = true;
                  assert!(c.validate(true, true, true).is_ok());
                  c.console.basic_auth.clear();
                  c.otlp.require_auth = false;
                  assert!(c.validate(false, false, false).is_ok(), "dev não é gateado");'''
          if old not in s:
              raise SystemExit('legacy public OTLP test block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Focused security tests
        run: |
          cargo test -p heraclitus-agent config::tests -- --nocapture
          cargo test -p heraclitus-server agent_plane::tests -- --nocapture
          cargo test -p heraclitus-agent-gateway
      - name: Clippy
        run: cargo clippy -p heraclitus-agent -p heraclitus-agent-gateway -p heraclitus-server --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release --locked -p heraclitus-server
      - name: Commit qualified fix and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/spec-0084-core-auth-barrier.yml scripts/spec0084_apply.py
          git add crates/heraclitus-agent/src/config.rs crates/heraclitus-server/src/agent_plane.rs docs/md/SPEC-new/SPEC-0084-Agent-Enforce-Core-Auth-Barrier.md
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(spec-0084): close anonymous Core bypass under agent enforce'
          git push origin HEAD:gpt56/agent-security-observability
