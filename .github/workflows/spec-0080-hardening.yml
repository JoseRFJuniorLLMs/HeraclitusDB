name: SPEC-0080 gateway trust-boundary hardening

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/spec0080-hardening-trigger

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Apply SPEC-0080 trust-boundary fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/heraclitus-agent-gateway/src/gateway.rs')
          s = p.read_text()

          old = '''    let server_id = header_map
              .get("x-heraclitus-server")
              .cloned()
              .unwrap_or_else(|| {
                  state
                      .upstream
                      .as_ref()
                      .and_then(|u| u.base().host().map(str::to_string))
                      .unwrap_or_else(|| "upstream".to_string())
              });
          '''.replace('              ', '        ').replace('                  ', '            ')
          # The replacement above only normalizes the literal's presentation in YAML.
          # Use the exact source spelling if normalization differs.
          exact = '''    let server_id = header_map
              .get("x-heraclitus-server")
              .cloned()
              .unwrap_or_else(|| {
                  state
                      .upstream
                      .as_ref()
                      .and_then(|u| u.base().host().map(str::to_string))
                      .unwrap_or_else(|| "upstream".to_string())
              });
          '''
          # Robustly find from semantic boundaries instead of depending on indentation.
          start = s.index('    let server_id = header_map\n')
          end = s.index('\n\n    let mut exchange = McpExchange {', start)
          new = '''    // Trust boundary: policy resource identity is derived from the configured
              // upstream. A caller-controlled X-Heraclitus-Server is correlation metadata
              // only and can never select another server's policy rules.
              let server_id = state
                  .upstream
                  .as_ref()
                  .and_then(|u| u.base().host().map(str::to_string))
                  .unwrap_or_else(|| "upstream".to_string());

              // Bound untrusted correlation metadata before copying it into durable evidence.
              for nome in [
                  "x-heraclitus-agent",
                  "x-heraclitus-run",
                  "x-heraclitus-user",
                  "x-heraclitus-environment",
                  "x-heraclitus-trace",
                  "x-heraclitus-server",
              ] {
                  if header_map.get(nome).is_some_and(|v| v.len() > 512) {
                      return mcp_error(
                          StatusCode::BAD_REQUEST,
                          &None,
                          "CORRELATION_HEADER_TOO_LARGE",
                          &format!("{nome} excede 512 bytes"),
                      );
                  }
              }

              // In OIDC mode the identity used by policy and evidence comes from the
              // validated token, never from spoofable X-Heraclitus-* headers.
              let principal = if runtime.gateway.identity.mode == "oidc" {
                  match crate::auth::principal_from(runtime, &headers, now_unix_seconds()) {
                      Ok(p) => Some(p),
                      Err(e) => return mcp_error(e.status, &None, e.code, &e.detail),
                  }
              } else {
                  None
              };
              let trusted_agent = principal
                  .as_ref()
                  .map(|p| p.subject.clone())
                  .or_else(|| header_map.get("x-heraclitus-agent").cloned());
              let trusted_human = principal
                  .as_ref()
                  .map(|p| p.subject.clone())
                  .or_else(|| header_map.get("x-heraclitus-user").cloned());

              // Gateway credentials authenticate to the gateway, not to its upstream.
              let mut upstream_header_map = header_map.clone();
              if principal.is_some() {
                  upstream_header_map.remove("authorization");
              }
          '''
          # De-indent the YAML-friendly source body to Rust's actual indentation.
          lines = new.splitlines()
          normalized=[]
          for line in lines:
              if line.startswith('              '): line = '    ' + line[14:]
              elif line.startswith('                  '): line = '        ' + line[18:]
              elif line.startswith('                      '): line = '            ' + line[22:]
              normalized.append(line)
          new='\n'.join(normalized)
          s = s[:start] + new + s[end:]

          s = s.replace(
              '        agent_id: header_map.get("x-heraclitus-agent").cloned(),\n        human_subject: header_map.get("x-heraclitus-user").cloned(),',
              '        agent_id: trusted_agent,\n        human_subject: trusted_human,', 1)
          s = s.replace(
              '        return forward_or_error(&state, &method, &uri, &header_map, body).await;',
              '        return forward_or_error(&state, &method, &uri, &upstream_header_map, body).await;', 1)
          s = s.replace(
              '    let resultado = forward(&state, &method, &uri, &header_map, body).await;',
              '    let resultado = forward(&state, &method, &uri, &upstream_header_map, body).await;', 1)

          for required in ['agent_id: trusted_agent', '&upstream_header_map, body', 'CORRELATION_HEADER_TOO_LARGE', 'principal_from(runtime']:
              if required not in s: raise SystemExit(f'missing patched token: {required}')
          p.write_text(s)
          PY
          cargo fmt --all

      - name: Focused tests and lint
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p heraclitus-agent --all-targets
          cargo test --locked -p heraclitus-agent-gateway --all-targets
          cargo clippy --locked -p heraclitus-agent-gateway --all-targets -- -D warnings

      - name: Commit qualified fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/spec0080-hardening-trigger .github/workflows/spec-0080-hardening.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(spec-0080): harden gateway identity and resource trust boundary'
          git push origin HEAD:gpt56/agent-security-observability
