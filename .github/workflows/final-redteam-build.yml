name: Final red-team security candidate

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/workflows/final-redteam-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c80420cf201158a5addc6f7a4803d0072deffe81
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Build release server
        run: cargo build --release --locked -p heraclitus-server
      - name: Package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/heraclitus-server dist/
          cp -R labs/Agent-Atack-Heraclitus dist/
          printf '%s\n' c80420cf201158a5addc6f7a4803d0072deffe81 > dist/COMMIT
          sha256sum dist/heraclitus-server > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heraclitus-final-redteam-c80420
          path: dist/
          if-no-files-found: error
          retention-days: 1
