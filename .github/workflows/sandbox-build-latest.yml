name: Sandbox latest hardened binary
on:
  push:
    branches: [gpt56/agent-security-observability]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Focused security gates
        run: |
          cargo test -p heraclitus-agent mcp:: -- --nocapture
          cargo test -p heraclitus-agent-gateway --all-features
      - name: Build release server
        run: cargo build --release -p heraclitus-server
      - name: Package
        run: |
          mkdir -p dist/Agent-Atack-Heraclitus
          cp target/release/heraclitus-server dist/
          cp labs/Agent-Atack-Heraclitus/*.py labs/Agent-Atack-Heraclitus/*.sh labs/Agent-Atack-Heraclitus/*.json labs/Agent-Atack-Heraclitus/*.md dist/Agent-Atack-Heraclitus/ 2>/dev/null || true
          cp -r labs/Agent-Atack-Heraclitus/tests dist/Agent-Atack-Heraclitus/
          git rev-parse HEAD > dist/COMMIT
          sha256sum dist/heraclitus-server > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heraclitus-sandbox-latest
          path: dist
          retention-days: 1
