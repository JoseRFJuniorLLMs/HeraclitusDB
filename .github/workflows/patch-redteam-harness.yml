name: Patch redteam harness findings
on:
  push:
    branches: [gpt56/agent-security-observability]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
      - name: Patch harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('labs/Agent-Atack-Heraclitus/massive_runner.py')
          s=p.read_text()
          s=s.replace("f'mix-{i%11}'", "f'mix-{i}'")
          start=s.index('    def otlp_oversized_fanout(self):')
          end=s.index('    def protocol_surface_swirl(self):', start)
          block="""    def otlp_oversized_fanout(self):
              n=12*self.scale; size=int(self.cfg.get('oversized_bytes',5*1024*1024)); payload=b'{\"resourceSpans\":[],\"pad\":\"'+b'x'*size+b'\"}'; t=time.perf_counter()
              def one(_):
                  status,body,_=self.lab.request(self.cfg['otlp'],'/v1/traces','POST',payload,{'Content-Type':'application/json'},timeout=20,read_body=False)
                  exc=(body or {}).get('exception') if isinstance(body,dict) else None
                  return status,exc
              with concurrent.futures.ThreadPoolExecutor(max_workers=min(12,self.workers)) as ex: outcomes=list(ex.map(one,range(n)))
              statuses=[status for status,_ in outcomes]
              # Early close is a valid oversized-body rejection: the server may
              # send/close before Python finishes uploading. Timeouts remain failures.
              early_close={'BrokenPipeError','ConnectionResetError','RemoteDisconnected'}
              rejected=all(status==413 or (status is None and exc in early_close) for status,exc in outcomes)
              health,_,_=self.lab.request(self.cfg['agent_api'],'/api/v1/agent/status',headers=self.lab.auth_agent()); ok=rejected and health==200
              exceptions=Counter(exc for status,exc in outcomes if status is None)
              self.aggregate('otlp-oversized-fanout','otlp:/v1/traces',f'{n} oversized rejected and service alive',ok,statuses,None,None,blocked=True,
                             detail=f'{size} bytes/request health={health} early_close={dict(exceptions)}',started=t)

"""
          p.write_text(s[:start]+block+s[end:])
          PY
          python3 -m py_compile labs/Agent-Atack-Heraclitus/massive_runner.py
          grep -q "f'mix-{i}'" labs/Agent-Atack-Heraclitus/massive_runner.py
          grep -q "early_close" labs/Agent-Atack-Heraclitus/massive_runner.py
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-redteam-harness.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add labs/Agent-Atack-Heraclitus/massive_runner.py .github/workflows/patch-redteam-harness.yml
          git commit -m 'fix(redteam): isolate mixed request ids and classify OTLP early reject'
          git push origin HEAD:gpt56/agent-security-observability
