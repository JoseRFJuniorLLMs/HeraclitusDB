name: Fix red-team runner findings
on:
  push:
    branches: [gpt56/agent-security-observability]
    paths: ['.github/workflows/fix-redteam-runner.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
      - name: Patch runner truthfulness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('labs/Agent-Atack-Heraclitus/runner_massive.py')
          s=p.read_text()
          old="""    def credential_separation(self):
                  aid = self.attack_id('credential-separation')
                  core_on_agent = self.core_auth(True)
                  s1, _, _ = self.request(self.cfg['agent_api'], '/api/v1/agent/status', headers=core_on_agent)
                  agent_on_core = self.auth_agent()
                  s2, _, ms = self.request(self.cfg['core_rest'], '/stats', headers=agent_on_core)
                  ok = s1 in {401, 403} and s2 in {401, 403}
                  self.report(Result(aid, 'credential-plane-separation', 'core↔agent', 'cross-plane credentials rejected',
                                     f'agent={s1} core={s2}', ok, s2, blocked=ok,
                                     detail='Core Basic must not authenticate Agent; Agent token must not authenticate Core', duration_ms=ms))
          """.replace('        ','')
          # Preserve exact indentation while replacing the function block by markers.
          a=s.index('    def credential_separation(self):')
          b=s.index('\n    def multi_agent_same_rpc_id',a)
          new="""    def credential_separation(self):
              aid = self.attack_id('credential-separation')
              snapshot = self.status_snapshot()
              if snapshot.get('auth') == 'dev_local':
                  self.report(Result(aid, 'credential-plane-separation', 'core↔agent',
                                     'N/A: dev_local deliberately has no Agent credential boundary',
                                     'N/A dev_local', True, blocked=False,
                                     detail='Use basic/OIDC profile to qualify cross-plane credential separation'))
                  return
              core_on_agent = self.core_auth(True)
              s1, _, _ = self.request(self.cfg['agent_api'], '/api/v1/agent/status', headers=core_on_agent)
              agent_on_core = self.auth_agent()
              s2, _, ms = self.request(self.cfg['core_rest'], '/stats', headers=agent_on_core)
              ok = s1 in {401, 403} and s2 in {401, 403}
              self.report(Result(aid, 'credential-plane-separation', 'core↔agent', 'cross-plane credentials rejected',
                                 f'agent={s1} core={s2}', ok, s2, blocked=ok,
                                 detail='Core and Agent credentials are intentionally distinct', duration_ms=ms))
          """
          s=s[:a]+new+s[b:]
          bad="detail=f'approval={approval[:18]}… statuses={{{s:statuses.count(s) for s in set(statuses)}}}'))"
          good='detail=f"approval={approval[:18]}… statuses={ {code: statuses.count(code) for code in set(statuses)} }"))'
          if bad not in s:
              raise SystemExit('approval status formatting pattern not found')
          s=s.replace(bad,good)
          p.write_text(s)
          PY
          python3 -m py_compile labs/Agent-Atack-Heraclitus/runner_massive.py
      - name: Commit fix and remove helper
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-redteam-runner.yml
          git add labs/Agent-Atack-Heraclitus/runner_massive.py
          git commit -m 'fix(redteam): distinguish dev-local auth and report approval races'
          git push origin HEAD:gpt56/agent-security-observability
