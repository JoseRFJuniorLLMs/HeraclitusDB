name: Red-team massive sandbox build

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - .github/workflows/redteam-massive-build.yml
      - crates/heraclitus-agent/**
      - crates/heraclitus-agent-gateway/**
      - crates/heraclitus-server/**
      - labs/Agent-Atack-Heraclitus/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Python guard tests
        run: python3 -m unittest discover -s labs/Agent-Atack-Heraclitus/tests -v
      - name: Python syntax
        run: |
          python3 -m py_compile labs/Agent-Atack-Heraclitus/runner.py
          python3 -m py_compile labs/Agent-Atack-Heraclitus/runner_massive.py
          python3 -m py_compile labs/Agent-Atack-Heraclitus/stub_upstream.py
      - name: Focused Rust security tests
        run: |
          cargo test --locked -p heraclitus-agent
          cargo test --locked -p heraclitus-agent-gateway
      - name: Build release server
        run: cargo build --release --locked -p heraclitus-server
      - name: Package exact revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp target/release/heraclitus-server dist/
          cp -R labs/Agent-Atack-Heraclitus dist/Agent-Atack-Heraclitus
          git rev-parse HEAD > dist/COMMIT
          sha256sum dist/heraclitus-server > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heraclitus-redteam-massive
          path: dist/
          if-no-files-found: error
          retention-days: 1
