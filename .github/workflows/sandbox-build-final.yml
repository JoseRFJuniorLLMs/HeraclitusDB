name: Sandbox build corrected HeraclitusDB

on:
  push:
    branches:
      - gpt56/agent-security-observability
    paths:
      - '.github/workflows/sandbox-build-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Build corrected server
        run: cargo build --release -p heraclitus-server
      - name: Record commit and checksum
        shell: bash
        run: |
          mkdir -p sandbox-artifact/Agent-Atack-Heraclitus
          cp target/release/heraclitus-server sandbox-artifact/
          cp -r labs/Agent-Atack-Heraclitus/. sandbox-artifact/Agent-Atack-Heraclitus/
          git rev-parse HEAD > sandbox-artifact/COMMIT
          sha256sum sandbox-artifact/heraclitus-server > sandbox-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: heraclitus-sandbox-corrected
          path: sandbox-artifact/
          if-no-files-found: error
          retention-days: 1
