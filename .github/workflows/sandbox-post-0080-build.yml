name: Sandbox post SPEC-0080 build
on:
  push:
    branches: [gpt56/agent-security-observability]
    paths: ['.github/workflows/sandbox-post-0080-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Security regression
        run: |
          cargo test -p heraclitus-agent-gateway --test gateway_end_to_end spec_0080
          cargo test -p heraclitus-agent-gateway gateway::method_canonical_tests
      - name: Build release server
        run: cargo build --release --locked -p heraclitus-server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/heraclitus-server dist/
          cp -R labs/Agent-Atack-Heraclitus dist/
          git rev-parse HEAD > dist/COMMIT
          sha256sum dist/heraclitus-server > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heraclitus-post-0080-sandbox
          path: dist/
          retention-days: 1
