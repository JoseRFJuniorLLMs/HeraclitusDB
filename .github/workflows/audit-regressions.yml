name: Audit regressions and Linux packages
on:
  push:
    branches: ['fix/pendencias-auditorias-2026-10-20', main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Compile and lint affected targets
        run: cargo clippy --locked -p heraclitus-server -p heraclitus-tier -p heraclitus-raft --all-targets --features heraclitus-server/tier,heraclitus-server/replication -- -D warnings
      - name: Security, cold recall, recovery and replication regressions
        run: cargo test --locked -p heraclitus-crypto -p heraclitus-log -p heraclitus-tier -p heraclitus-memtable -p heraclitus-raft -p heraclitus-server --features heraclitus-server/tier,heraclitus-server/replication --no-fail-fast -- --test-threads=2
      - name: Formatting
        if: '!cancelled()'
        run: cargo fmt --all --check
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev rpm cpio
      - name: Compile release binaries in GitHub
        run: cargo build --release --locked -p heraclitus-server -p heraclitus-qualifier
      - name: Build and inspect native package payloads
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "heraclitus-server") | .version')
          mkdir -p "$RUNNER_TEMP/payload/bin"
          cp target/release/heraclitus-server target/release/heraclitus-qualifier "$RUNNER_TEMP/payload/bin/"
          cp "docs/md/RELEASE_NOTES_v$version.md" "$RUNNER_TEMP/payload/RELEASE_NOTES.md"
          jq -n --arg commit "$GITHUB_SHA" --arg version "$version" '{git_commit:$commit,release_version:$version}' > "$RUNNER_TEMP/payload/build-manifest.json"
          bash packaging/build-linux-packages.sh "$RUNNER_TEMP/payload" "$version" "$RUNNER_TEMP/native-packages"
          dpkg-deb --extract "$RUNNER_TEMP/native-packages/"*.deb "$RUNNER_TEMP/deb"
          mkdir -p "$RUNNER_TEMP/rpm"
          rpm2cpio "$RUNNER_TEMP/native-packages/"*.rpm | (cd "$RUNNER_TEMP/rpm" && cpio -id --quiet --no-absolute-filenames)
          for kind in deb rpm; do
            cmp target/release/heraclitus-server "$RUNNER_TEMP/$kind/usr/bin/heraclitus-server"
            "$RUNNER_TEMP/$kind/usr/bin/heraclitus-server" --version | grep -F "git $GITHUB_SHA clean"
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: linux-native-package-candidate
          path: ${{ runner.temp }}/native-packages/
          if-no-files-found: error
