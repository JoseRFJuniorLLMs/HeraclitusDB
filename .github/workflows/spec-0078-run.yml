name: SPEC-0078 corrective pass

on:
  push:
    branches:
      - gpt56/spec-0078-agent-hardening
    paths:
      - .github/spec-0078-trigger2

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/spec-0078-agent-hardening
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Apply source fixes
        run: python3 .github/spec0078_apply.py

      - name: Resolve dependency security updates
        shell: bash
        run: |
          set -euxo pipefail
          cargo update -p rustls --precise 0.23.45
          echo '=== lru reverse tree before update ==='
          cargo tree -i lru || true
          if cargo update -p lru --precise 0.18.2; then
            echo 'lru 0.18.2 accepted by dependency constraints'
          else
            echo 'lru 0.18.2 is outside a parent constraint; preserving diagnostics'
          fi
          echo '=== lru reverse tree after update attempt ==='
          cargo tree -i lru || true

      - name: Focused regressions
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo test -p heraclitus-agent action::tests
          cargo test -p heraclitus-agent-gateway --test gateway_end_to_end
          cargo test -p heraclitus-qualifier

      - name: Commit corrective pass
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/spec-0078-trigger .github/spec-0078-trigger2
          rm -f .github/spec0078_apply.py
          rm -f .github/workflows/spec-0078-fix-runner.yml
          rm -f .github/workflows/spec-0078-run.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec-0078): stabilize approvals and align qualification truth'
          git push origin HEAD:gpt56/spec-0078-agent-hardening

      - name: Supply-chain audit
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071
