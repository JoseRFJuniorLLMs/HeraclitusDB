[package]
name = "heraclitus-forensic"
version = "3.0.1"
edition = "2021"

[dependencies]
heraclitus-core = { path = "../heraclitus-core" }
heraclitus-crypto = { path = "../heraclitus-crypto" }
heraclitus-compliance = { path = "../heraclitus-compliance" }
p256 = { version = "0.13", features = ["ecdsa"] }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tempfile = { workspace = true }
hex = "0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
