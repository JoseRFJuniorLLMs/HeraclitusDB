[package]
name = "heraclitus-log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The source of truth: segmented append-only immutable log"

[dependencies]
heraclitus-core = { workspace = true }
heraclitus-btree = { workspace = true }
heraclitus-crypto = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
crc32fast = { workspace = true }
# SPEC-0050 §32: codecs de bloco do HRKL v6 PACKED.
zstd = { workspace = true }
lz4_flex = { workspace = true }
blake3 = { workspace = true }
memmap2 = { workspace = true }
crossbeam-channel = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }

[features]
# SPEC-0073 §8 — backend io_uring EXPERIMENTAL.
#
# Off por default: a §7 diz "PortableFileIo = default, LinuxUringIo =
# experimental", e a §11 so permite promover com >=1.10x de throughput ou
# p99 <= 0.85x, provados pela matriz da §10. Ligar por teoria e o que o I-5
# proibe.
linux-io-uring = ["dep:io-uring"]

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
proptest = { workspace = true }
# SPEC-0050 §165: os golden vectors constroem EventIds a partir de bytes fixos.
ulid = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "append"
harness = false

[[bench]]
name = "mmap_vs_read"
harness = false

[[bench]]
name = "append_scaling"
harness = false

[[bench]]
name = "carga_real_1m"
harness = false

[[bench]]
name = "carga_real_20m"
harness = false

[[bench]]
name = "otim_leitura"
harness = false

[[bench]]
name = "otim_crc"
harness = false

[[bench]]
name = "otim_boot"
harness = false

[[bench]]
name = "hrkl_v6_ab"
harness = false

# SPEC-0073 §10/§11 — A/B dos backends de I/O. Com `--features linux-io-uring`
# compara os dois; sem ela mede so o baseline, que continua a ser util para
# detectar regressao no caminho portatil.
[[bench]]
name = "io_backend_ab"
harness = false
