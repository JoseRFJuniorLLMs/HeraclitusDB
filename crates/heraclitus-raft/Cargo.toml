[package]
name = "heraclitus-raft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Replication: log shipping v0 (RFC-003); openraft consensus behind `replication` feature (TCP + gRPC transports)"

[features]
# SPEC-015/021 — the openraft consensus upgrade: leader election + quorum
# commit + automatic failover, proven by the 18 in-process cluster tests in
# src/consensus.rs (they pass against both storage formats; see
# HERACLITUS_RAFT_TEST_FORMAT).
#
# Still off by default, but NOT for the reason this comment used to give. The
# network transport and the durable raft-log landed on 2026-07-10; the reason
# now is dependency weight: turning it on pulls openraft and tonic into every
# consumer of this crate, and heraclitus-server gates it behind its own
# `replication` feature anyway.
#
# The cost of it being off is that `cargo test --workspace` reports "ok" with
# "0 passed" for this crate, which reads as coverage and is not. Until that is
# a hard error somewhere, `consenso_so_e_testado_com_features_replication`
# below makes the gap visible in the default test output.
replication = [
    "dep:openraft",
    "dep:tokio",
    "dep:bincode",
    "dep:serde",
    "dep:tonic",
    "dep:tokio-stream",
    "dep:heraclitus-proto",
]

[dependencies]
heraclitus-core = { workspace = true }
heraclitus-log = { workspace = true }
heraclitus-proto = { workspace = true, optional = true }
openraft = { version = "0.9", features = ["serde", "storage-v2"], optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, features = ["net"], optional = true }
tonic = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# Proves the core invariant end-to-end: only the log ships over the wire, yet
# each node's derived graph view hydrates to a bit-identical state_hash.
heraclitus-index-graph = { workspace = true }
heraclitus-views = { workspace = true }
