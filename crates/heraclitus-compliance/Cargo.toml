[package]
name = "heraclitus-compliance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Camada de conformidade para governo: carimbo de tempo RFC 3161 (ICP-Brasil), ancoragem da raiz de Merkle e recibos jurídicos."

[dependencies]
heraclitus-core = { workspace = true }
heraclitus-log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
# pure-Rust crypto/ASN.1 (sem dependências em C: o build gnu no Windows continua limpo)
der = { workspace = true }
const-oid = { workspace = true }
sha2 = { workspace = true }
p256 = { workspace = true }
# async daemon (carimbagem por linha d'água)
tokio = { workspace = true }
tracing = { workspace = true }
fips204 = "0.4.6"
# SPEC-0046 Marco 0 — parsing de X.509 e de CMS/TimeStampToken.
#
# Da familia RustCrypto, a mesma de `der`/`spki`/`const-oid`/`p256` que este
# crate ja usava: uma so versao de `der` em toda a arvore, sem duplicacao de
# tipos. A alternativa era escrever ASN.1 e validacao de cadeia a mao, que num
# crate de compliance e a coisa mais perigosa que se pode acrescentar.
#
# A feature `builder` do x509-cert e usada SO nos testes, para gerar uma PKI
# sintetica: nao se embarcam certificados ICP-Brasil reais num repositorio.
x509-cert = { version = "0.2", features = ["builder"] }
cms = "0.2"
rsa = "0.9"
# Parametros de RSASSA-PSS: o digest de um PSS vem dos parametros, nao do OID.
pkcs1 = "0.7"
# A feature `ring` e explicita porque a arvore tem `ring` E `aws-lc-rs`
# (vindos de dependentes diferentes) e, com as duas presentes, o rustls nao
# consegue escolher um provider por omissao — o `ClientConfig::builder()`
# ENTRA EM PANICO em vez de devolver erro. O provider e escolhido
# explicitamente no `tls_config`; esta feature so garante que ele existe.
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"

[dev-dependencies]
tempfile = { workspace = true }
# A feature `sha2` do `rsa` so acrescenta os impls de RsaSignatureAssociatedOid
# (Sha256/384/512 -> OID de assinatura), de que a PKI SINTETICA precisa para
# emitir certificados RSA. Fica em dev-dependencies de proposito: o binario de
# producao nao precisa de emitir certificados, so de os verificar.
#
# `sha1` NAO e activada e nao deve ser: activa-la poria o OID de
# sha1WithRSAEncryption ao alcance de codigo que nao o deve poder produzir.
rsa = { version = "0.9", features = ["sha2"] }
