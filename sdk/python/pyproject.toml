[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heraclitusdb"
version = "0.1.0"
description = "Cliente Python para o HeraclitusDB — banco de auditoria event-sourced (log imutável, AS OF, Merkle, provenance)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jose R F Junior", email = "web2ajax@gmail.com" }]
keywords = ["heraclitusdb", "event-sourcing", "audit", "graph", "provenance", "merkle", "grpc"]
dependencies = ["grpcio>=1.50", "protobuf>=4.21"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["grpcio-tools>=1.50", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/JoseRFJuniorLLMs/HeraclitusDB"

[tool.setuptools]
packages = ["heraclitusdb"]

[tool.setuptools.package-data]
heraclitusdb = ["*.py"]
