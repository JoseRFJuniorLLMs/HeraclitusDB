# HeraclitusDB — configuração de referência para instalação com systemd.
#
# A unit em packaging/systemd/heraclitusdb.service arranca SEM este ficheiro:
# define as variáveis HERACLITUS_* necessárias e usa os defaults para o resto.
# Este ficheiro existe para quem prefere TOML a variáveis de ambiente.
#
# Para o usar:
#   install -D -m 0644 packaging/heraclitus.toml /etc/heraclitusdb/heraclitus.toml
# e acrescente o caminho ao ExecStart da unit:
#   ExecStart=/usr/bin/heraclitus-server /etc/heraclitusdb/heraclitus.toml
#
# As variáveis HERACLITUS_* têm PRIORIDADE sobre o que estiver aqui. Se instalar
# este ficheiro, remova da unit os `Environment=` que quiser controlar por TOML,
# senão o ambiente ganha e o ficheiro parece não ter efeito.

# ── Caminhos ─────────────────────────────────────────────────────────────────
#
# ABSOLUTOS, e não por estética: o default do produto é `./data`, relativo ao
# CWD. Sob systemd o CWD é `/` a menos que a unit defina WorkingDirectory, e com
# ProtectSystem=full a criação de `/data` falha. Um caminho relativo numa
# instalação de serviço é um arranque que não acontece.
data_dir = "/var/lib/heraclitusdb"
cold_tier_path = "/var/lib/heraclitusdb/cold"

# ── Rede ─────────────────────────────────────────────────────────────────────
#
# Loopback. A superfície REST inclui ESCRITAS duráveis (/hvm/*, /tier/demote,
# /sql) e, sem `rest_basic_auth`, o servidor só as aceita em loopback — recusa
# arrancar se `rest_addr` não for loopback e a auth não estiver definida.
# Para expor, ponha um proxy TLS à frente ou defina a autenticação abaixo.
grpc_addr = "127.0.0.1:7474"
rest_addr = "127.0.0.1:7475"

# ── Segurança ────────────────────────────────────────────────────────────────
#
# Descomente para exigir `authorization: Bearer <token>` em TODA chamada gRPC.
# Sem isto, qualquer cliente que alcance a porta corre como Admin.
# auth_token = "troque-por-um-segredo-forte"
#
# HTTP Basic para a superfície REST. Obrigatório se `rest_addr` não for loopback.
# rest_basic_auth = "utilizador:senha"

# ── Durabilidade ─────────────────────────────────────────────────────────────
#
# `always` faz fsync por append. É o default e é o que se quer numa base que
# promete durabilidade; as alternativas trocam segurança por débito.
fsync = "always"

# ── Manutenção em background ─────────────────────────────────────────────────
#
# Empacotamento RAW->PACKED e recolha de lixo das gerações físicas. Zero desliga.
v6_packing_interval_secs = 30
v6_gc_interval_secs = 300

# Checkpoint periódico das views. Limita a cauda que um arranque pós-crash tem
# de replayar — sem isto só há checkpoint no arranque e no encerramento limpo.
checkpoint_interval_secs = 300

# ── Sentinel: arranque rápido (SPEC-0072) ────────────────────────────────────
#
# O Sentinel está desligado por omissão. O que segue só tem efeito com
# `[sentinel] enabled = true`.
#
# [sentinel]
# enabled = true
#
# Lote do replay janelado do arranque. Existe porque o arranque deixou de
# materializar a base inteira em memória: a memória do replay fica limitada ao
# estado materializado mais este lote.
# replay_batch_events = 8192
#
# Cadência do snapshot de estado. Basta um dos dois limiares ser atingido — são
# riscos diferentes: o de eventos limita quanto trabalho um crash desfaz, o de
# tempo garante que uma base com pouco tráfego não fica indefinidamente sem
# snapshot. Zero desliga o limiar respectivo.
# snapshot_interval_events = 100000
# snapshot_interval_secs = 300
#
# Contrato de lateness do histórico L1. O histórico retém a maior janela que o
# ruleset consulta MAIS esta tolerância; um evento que chegue mais atrasado do
# que isto não participa em correlações. Subir se alguma fonte entregar com
# atraso maior — o custo é memória, e ela cresce com o valor.
# [sentinel.l1]
# max_lateness_ms = 300000
# history_capacity = 100000
#
# O que fazer quando o cursor persistido está À FRENTE do log canónico, o que
# significa que se perdeu cauda (restauro de backup, truncagem por corrupção).
#
#   rebuild  reconstrói o estado derivado a partir do log. É o default, porque
#            nada do que o Sentinel persiste fora do log é fonte da verdade e
#            recusar arrancar por causa de uma cópia deixaria a base indisponível.
#            A divergência é contada em telemetria e o cursor divergente fica
#            preservado em `sentinel/cursor.divergent.*.json`.
#   strict   recusa o arranque. Para ambientes forenses onde nenhuma recuperação
#            automática pode ocorrer sem um humano.
# [sentinel.recovery]
# cursor_policy = "rebuild"

# ── Sentinel: health gate da telemetria (SPEC-0071 §9.1) ─────────────────────
#
# O inquilino cuja saúde de telemetria a política de resposta interroga antes de
# aprovar uma acção automática. Sem isto não há sonda ligada, e uma regra que
# declare `required_telemetry` passa a exigir aprovação humana em vez de aprovar.
#
# É explícito de propósito: deixar o inquilino ser escolhido pelo caminho de
# dados permitiria satisfazer um requisito de saúde com a telemetria de outro.
# [sentinel]
# health_gate_tenant_id = "o-teu-tenant"
